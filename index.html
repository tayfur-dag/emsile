orunmak", "Şiir yazmak", "Cümle kurmak"], "c": 1, "k": "T01"}, {"s": "Emsile'den sonra hangi kitap okunur?", "se": ["Avâmil", "Binâ", "İzhâr", "Kâfiye"], "c": 1, "k": "T03"}]}], "oyunlar": [{"no": 1, "ad": "Sîga Sandalyesi", "sure": "10 dk", "hazirlik": "Sınıftaki sandalyelere birer sîga kâğıdı yapıştırılır. Başlangıçta 3–5 sandalye yeter; muttarideye geçilince 14'e çıkarılır.", "nasil": ["Çocuklar ayakta, sandalyelerin çevresinde dolaşır.", "Hoca bir sîganın manasını söyler: \"Yardım etti!\"", "Herkes doğru sandalyeye koşup oturur.", "Yanlış sandalyeye oturan bir tur bekler, doğru oturan bir puan alır."], "varyasyon": "İleri seviye: hoca manayı değil, tasrîf hânesini söyler — \"cemî gâib müennes!\"", "nezaman": "Yeni sîga öğrenilen günün ertesinde; salı ve perşembe uygundur."}, {"no": 2, "ad": "Tasrîf Merdiveni", "sure": "12 dk", "hazirlik": "Tahtaya alt alta 14 basamak çizilir; en üste \"nihâyet\" yazılır.", "nasil": ["Çocuk birinci basamaktan başlar: نَصَرَ.", "Doğru söylerse bir basamak çıkar; sıradaki sîgayı söyler.", "Şaşırırsa en alta döner ve sıra arkadaşına geçer.", "Merdiveni ilk bitiren haftanın tasrîf ustası olur."], "varyasyon": "İki takım, iki merdiven; yarış hâlinde oynanır.", "nezaman": "Muttaride başladıktan sonra (9. haftadan itibaren) her hafta."}, {"no": 3, "ad": "Kalıp Kartları", "sure": "10 dk", "hazirlik": "A5 karton. Ön yüzde Arapça sîga, arka yüzde Türkçe manası ve adı. Her hafta yeni kart eklenir; kartlar Tekrar Kutusu'nda saklanır.", "nasil": ["Hoca kartın Arapça yüzünü gösterir, çocuk manasını söyler.", "Sonra ters çevrilir: mana söylenir, çocuk Arapçasını yazar.", "Süre tutulur: 30 saniyede kaç doğru?"], "varyasyon": "Eşleştirme sürümü: kartlar ikiye bölünür, Arapça ve Türkçe parçalar karıştırılıp eşleştirilir.", "nezaman": "Her cuma ısınma turunda; ayrıca aralıklı tekrar günlerinde."}, {"no": 4, "ad": "Sîga Avı", "sure": "15 dk", "hazirlik": "Kısa bir sûre veya âyet büyük puntoyla basılır, herkese bir nüsha dağıtılır.", "nasil": ["\"Bu âyette bildiğimiz sîgalardan kaç tane var?\"", "Çocuklar buldukları kelimeyi kalemle yuvarlak içine alır.", "Sırayla okunur: kelime, sîganın adı, manası.", "Doğru her tespit bir puan; sîganın adını da söyleyen iki puan alır."], "varyasyon": "Ezberden avlanma: mushafa bakmadan, ezberindeki sûreden sîga çıkarma.", "nezaman": "Her çarşamba, Kur'an gününün ana etkinliği."}, {"no": 5, "ad": "Kim Yardım Etti?", "sure": "10 dk", "hazirlik": "Hazırlık gerekmez.", "nasil": ["Hoca bir muttaride sîgası söyler: نَصَرَتَا.", "Çocuklar sahneyi canlandırır: kaç kişi? erkek mi kadın mı? kim yardım etti?", "İki kız öne çıkıp birbirine yardım ederse doğru; sınıf onaylar.", "Yanlış canlandırmada doğru olan gösterilir, üzerinde konuşulur."], "varyasyon": "Tersine oyun: hoca sahneyi canlandırır, çocuklar sîgayı söyler.", "nezaman": "Müfred–tesniye–cemî ve müzekker–müennes ayrımının yeni işlendiği haftalarda (9–13)."}, {"no": 6, "ad": "Yanlış Avcısı", "sure": "8 dk", "hazirlik": "Hoca önceden 5–6 kasıtlı hata belirler.", "nasil": ["Hoca tasrîfi yüksek sesle okur, arada kasten yanlış okur: نَصِرَ, يُنْصُرُ gibi.", "Hatayı ilk yakalayan elini kaldırır ve doğrusunu söyler.", "Doğru düzelten puan alır; boş yere el kaldıran bir puan kaybeder."], "varyasyon": "Yazılı sürüm: tahtaya hatalı bir tasrîf yazılır, çocuklar hataları defterine listeler.", "nezaman": "Cuma ısınmasında; ezberin sağlamlığını ölçer."}, {"no": 7, "ad": "Zaman Makinesi", "sure": "10 dk", "hazirlik": "Üç kutu veya sınıfın üç köşesi: GEÇMİŞ, ŞİMDİ, GELECEK.", "nasil": ["Sîga kartları karıştırılıp dağıtılır.", "Her çocuk kartını okur ve doğru kutuya atar.", "Tartışmalı kartlar (مَا يَنْصُرُ ve لَا يَنْصُرُ gibi) sınıfça konuşulur."], "varyasyon": "Dördüncü kutu eklenir: ZAMANSIZ (isimler buraya gider).", "nezaman": "Menfî sîgaların işlendiği 18–22. haftalarda vazgeçilmezdir."}, {"no": 8, "ad": "Ma'lûm–Mechûl Düellosu", "sure": "12 dk", "hazirlik": "Sınıf iki takıma ayrılır.", "nasil": ["Birinci takım bir ma'lûm sîga söyler: نَصَرْتُمْ.", "İkinci takımın 10 saniye içinde mechûlünü bulması gerekir: نُصِرْتُمْ.", "Bulursa sıra onlara geçer, bulamazsa puan karşı takıma yazılır.", "Beş puana ilk ulaşan kazanır."], "varyasyon": "Mechûlü olmayan sîgalar (masdar gibi) tuzak olarak atılır; \"bunun mechûlü yok!\" diyen iki puan alır.", "nezaman": "12. haftadan itibaren, mechûl işlenen her ünitede."}, {"no": 9, "ad": "Saf Tasrîfi", "sure": "8 dk", "hazirlik": "Hazırlık gerekmez.", "nasil": ["Çocuklar tek sıra dizilir.", "Birinci tasrîfin ilk sîgasını söyler, ikinci ikinciyi, böyle devam eder.", "Zincir kopmadan 14 hâne tamamlanmalıdır.", "Kopan yerden yeniden başlanır; her turda hız artırılır."], "varyasyon": "Ters saf: tasrîf sondan başa doğru söylenir. Zordur, ezberi çok sağlamlaştırır.", "nezaman": "Her salı, ezber gününün kapanışında."}, {"no": 10, "ad": "Kök Değirmeni", "sure": "15 dk", "hazirlik": "Kartondan bir çark; üzerinde 24 sîganın adı. Ayrıca kök kartları: كَتَبَ، فَتَحَ، خَرَجَ، دَخَلَ، عَلِمَ.", "nasil": ["Çocuk bir kök kartı çeker ve çarkı çevirir.", "Çıkan sîgayı, çektiği kökten türetip tahtaya yazar.", "Sınıf kontrol eder; doğruysa puan alır."], "varyasyon": "Süreli turnuva: iki dakikada en çok doğru türeten kazanır.", "nezaman": "8. ay (32–35. haftalar), yeni köklere geçildiğinde."}, {"no": 11, "ad": "Emsile Tombalası", "sure": "12 dk", "hazirlik": "Her çocuğa bir karton: üzerinde rastgele dizilmiş 9 (ileride 24) sîga. Kapatmak için fasulye veya pul.", "nasil": ["Hoca bir sîganın manasını veya adını okur.", "Çocuk kartonunda karşılığını bulup üstünü kapatır.", "Bir sırayı tamamlayan \"sıra!\", tamamını kapatan \"Emsile!\" diye seslenir.", "Kazanan kartonunu okuyarak doğrular."], "varyasyon": "Kur'an sürümü: hoca âyet okur, çocuk âyetteki sîgayı kapatır.", "nezaman": "Ay sonlarında, toplu tekrar haftalarında."}, {"no": 12, "ad": "Hafta Şampiyonu", "sure": "5 dk", "hazirlik": "Panoda haftalık puan çizelgesi.", "nasil": ["Hafta boyunca bütün oyunlardan alınan puanlar toplanır.", "Cuma dersinin sonunda toplam okunur.", "Şampiyona küçük bir ödül: haftaya ilk sırayı seçme hakkı, tahtaya yazma hakkı gibi.", "Puanı en çok artan çocuk da ayrıca anılır — mutlak birinci kadar önemlidir."], "varyasyon": "Takım sürümü: sınıf iki sabit takıma ayrılır, aylık şampiyon ilan edilir.", "nezaman": "Her cuma, dersin kapanışında."}], "konular": {"T01": {"ad": "Sarf ilminin tarifi, mevzuu, gayesi", "tekrar": "Ana Plan Ek-1 ve Emsilenin_musannıfı.doc · Hafta 1 Pazartesi"}, "T02": {"ad": "Emsile'nin musannıfı ve kitabın adı", "tekrar": "Emsilenin_musannıfı.doc · Hafta 1 Pazartesi"}, "T03": {"ad": "Muhtelife–muttaride ayrımı, 24 sîganın yapısı", "tekrar": "Kitap s.1–2 · Hafta 8 taksîmât dersi"}, "T04": {"ad": "Fi'l-i mâzî", "tekrar": "Kitap s.2–3 · Hafta 1 ve 10"}, "T05": {"ad": "Fi'l-i muzâri'", "tekrar": "Kitap s.3–4 · Hafta 1 ve 14"}, "T06": {"ad": "Masdar", "tekrar": "Kitap s.5 · Hafta 1 ve 16"}, "T07": {"ad": "İsm-i fâil", "tekrar": "Kitap s.5 · Hafta 2 ve 16"}, "T08": {"ad": "İsm-i mef'ûl", "tekrar": "Kitap s.5 · Hafta 2 ve 16"}, "T09": {"ad": "Cahd-ı mutlak (لَمْ)", "tekrar": "Kitap s.6 · Hafta 3 ve 18"}, "T10": {"ad": "Cahd-ı müstağrak (لَمَّا)", "tekrar": "Kitap s.7–8 · Hafta 3 ve 19"}, "T11": {"ad": "Nefy-i hâl (مَا)", "tekrar": "Kitap s.9–10 · Hafta 3 ve 20"}, "T12": {"ad": "Nefy-i istikbâl (لَا)", "tekrar": "Kitap s.10–11 · Hafta 3 ve 21"}, "T13": {"ad": "Te'kîd-i nefy-i istikbâl (لَنْ)", "tekrar": "Kitap s.12–13 · Hafta 3 ve 23"}, "T14": {"ad": "Beş menfî sîganın mukayesesi", "tekrar": "Hafta 22 zaman tablosu · Oyun 7 Zaman Makinesi"}, "T15": {"ad": "Emr-i gâib", "tekrar": "Kitap s.14 · Hafta 4 ve 24"}, "T16": {"ad": "Nehy-i gâib", "tekrar": "Kitap s.15 · Hafta 4 ve 25"}, "T17": {"ad": "Emr-i hâzır", "tekrar": "Kitap s.16 · Hafta 4 ve 27"}, "T18": {"ad": "Nehy-i hâzır", "tekrar": "Kitap s.17 · Hafta 4 ve 28"}, "T19": {"ad": "Nefiy ile nehiy arasındaki fark", "tekrar": "Emsilenin_musannıfı.doc 'Nefî ile nehîy' bendi · Hafta 25"}, "T20": {"ad": "İsm-i zamân, mekân ve masdar-ı mîmî", "tekrar": "Kitap s.18 · Hafta 5 ve 29"}, "T21": {"ad": "İsm-i âlet", "tekrar": "Kitap s.18 · Hafta 5 ve 29"}, "T22": {"ad": "Masdar binâ-i merre ve binâ-i nev'", "tekrar": "Kitap s.18 · Hafta 6 ve 29"}, "T23": {"ad": "İsm-i tasgīr", "tekrar": "Kitap s.18 · Hafta 6 ve 29 · musannıf notlarında vezinler"}, "T24": {"ad": "İsm-i mensûb", "tekrar": "Kitap s.19 · Hafta 6 ve 30"}, "T25": {"ad": "Mübâlağa ism-i fâil", "tekrar": "Kitap s.19 · Hafta 7 ve 30"}, "T26": {"ad": "İsm-i tafdîl", "tekrar": "Kitap s.19 · Hafta 7 ve 30"}, "T27": {"ad": "Fi'l-i taaccüb-i evvel ve sânî", "tekrar": "Kitap s.20–21 · Hafta 7 ve 31"}, "T28": {"ad": "Taksîmât: ihbârî/inşâî, müştak/câmid", "tekrar": "Sarf_-_Emsile_Taksimatı.pdf · Hafta 8"}, "T29": {"ad": "Muttaridenin 14 hânesi (şahıs, sayı, cinsiyet)", "tekrar": "Ana Plan Ek-2 boş kalıp · Hafta 9 · Oyun 5"}, "T30": {"ad": "Ma'lûm–mechûl ayrımı", "tekrar": "Kitap s.3–4 · Hafta 12–13 · Oyun 8 Düello"}, "T31": {"ad": "Kur'an'da sîga tanıma", "tekrar": "Sîga Avı Defteri · Hafta 35 · Oyun 4"}}, "haftaNotlari": {"1": {"b": [{"t": "Sarfın tarifi: Arapça kelimelerin yapısı kendisiyle bilinen ilimdir. Mevzuu kelime, gayesi yazarken ve okurken hatadan korunmak, hükmü farz-ı kifâye.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Emsile \"misaller\" demektir; mufâale bâbından ikinci masdardır. Musannıfı Hz. Ali (r.a.).", "k": "Emsilenin_musannıfı.doc; TDV İslâm Ansiklopedisi, 'el-Emsile' maddesi (musannif rivayetinin teberrüken olduğuna dair)"}, {"t": "Madde = harfler (ن ص ر), heyet = kalıp ve hareke. Sarf heyeti değiştirir, madde sabit kalır.", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}, {"t": "Niçin nasara ile başlandı: (1) musannıf Allah'tan yardım beklediği için, (2) yardımı sevdiği için, (3) bu kitap diğer kitapları öğrenmeye yardım edeceği için.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Mâzînin muzâri'ye takdîmi: geçmiş gelecekten, tahkīk teşkīkten, mücerred mezîdün fîhten mukaddemdir.", "k": "Genel şerh geleneği"}], "hata": "Sarf ile nahvi karıştırmak. Sarf kelimenin kendi yapısını, nahiv cümle içindeki hâlini inceler. \"Sarf ilimlerin anası, nahiv babasıdır.\"", "kaynak": "Emsilenin_musannıfı.doc · Kitap s.1"}, "2": {"b": [{"t": "İsm-i fâil: işi yapan (نَاصِرٌ, fâ'il vezni). İsm-i mef'ûl: işin kendisine yapıldığı (مَنْصُورٌ, mef'ûl vezni).", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}, {"t": "Fâilin mef'ûle takdîmi: fâil her fiile lâzımdır, mef'ûl değildir; ayrıca fâil ma'lûmdan, mef'ûl mechûlden müştaktır.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "فَ harfi fâ-i tefrî'iyyedir: ism-i fâilin fer', fiilin asıl olduğunu bildirir.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "هُوَ ve ذَاكَ niçin geldi: sülâsîde sîgalar ayrılır ama ziyâde bâblarda yalnız aynü'l-fiilin harekesi değişir (مُدَحْرِج / مُدَحْرَج).", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "Masdarın ism-i fâile takdîmi: masdar müştakun minh, ism-i fâil müştaktır.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}], "hata": "Çocuk نَاصِر ile مَنْصُور'u ters çevirir. Çare: \"م ile başlıyorsa işi yiyen, م yoksa işi yapan.\"", "kaynak": "2-MUHTELİFEDEKİ_SIRALAMA.doc · Kitap s.1"}, "3": {"b": [{"t": "لَمْ cahd-ı mutlak: geçmişte olmadı. لَمَّا cahd-ı müstağrak: henüz olmadı, beklenti vardır.", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}, {"t": "مَا nefy-i hâl: şimdi olmuyor. لَا nefy-i istikbâl: gelecekte olmaz. لَنْ te'kîd: elbette olmaz.", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}, {"t": "لَمْ ve لَمَّا dahil oldukları muzâri'yi lafzen muzâri', manen mâzî yapar; hem çevirir hem nefyeder.", "k": "Emsilenin_musannıfı.doc, 'Lem ve lemmâ' bendi"}, {"t": "Beşinin de muzâri'nin başına geldiğine, mâzînin başına gelmediğine dikkat çekilir.", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}], "hata": "مَا يَنْصُرُ ile لَا يَنْصُرُ karıştırılır. Ayırt edici tek şey zamandır: مَا şimdi, لَا gelecek.", "kaynak": "Emsilenin_musannıfı.doc 'Lem ve lemmâ' bendi · Kitap s.1"}, "4": {"b": [{"t": "Emr-i gâib: başında lâm-ı emir (لِيَنْصُرْ), vasıta ile verilen emirdir. Emr-i hâzır: karşıdakine (أُنْصُرْ).", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}, {"t": "Nehiy, لَا + meczûm muzâri'dir. Nefiydeki لَا âmil değildir; nehiydeki لَا âmil-i semâîdendir.", "k": "Emsilenin_musannıfı.doc, 'Nefî ile nehîy' bendi"}, {"t": "Nefiy ihbârîdir (haber verir), nehiy inşâîdir (talep eder).", "k": "Emsilenin_musannıfı.doc, 'Nefî ile nehîy' bendi"}, {"t": "Emr-i hâzırın başındaki hemze vasıl hemzesidir; aynü'l-fiil dammeli ise dammeli, kesreli/fethalı ise kesreli okunur.", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}], "hata": "لَا يَنْصُرُ (nefiy, merfû) ile لَا يَنْصُرْ (nehiy, meczûm) yalnız son harekeyle ayrılır. Tahtada iki harekeyi büyük ve renkli yaz.", "kaynak": "Kitap s.1 · Emsilenin_musannıfı.doc 'Nefî ile nehîy farkı'"}, "5": {"b": [{"t": "مَنْصَرٌ aslında üç vecihtir: ism-i zamân, ism-i mekân ve masdar-ı mîmî. Sîgaları aynı olduğu için tek vezinde birleşmiştir.", "k": "Kitap s.1-2 (EMSİLE_kitb.pdf)"}, {"t": "Hangisi kastedildiği siyak ve sebaktan anlaşılır: هٰذَا الزَّمَان / هٰذَا الْمَكَان / هٰذَا الْفِعْل.", "k": "Genel sarf malûmâtı"}, {"t": "مِنْصَرٌ ism-i âlettir, vezni مِفْعَلٌ. Eser ile müessir arasında vâsıtadır.", "k": "Kitap s.1-2 (EMSİLE_kitb.pdf)"}, {"t": "İsm-i âlet ziyâde bâblardan gelmez (bütün harfleri korumak mümkün olmadığı için) ve lâzım fiilde bulunmaz.", "k": "Emsilenin_musannıfı.doc, 'İsmi âlet' bendi"}, {"t": "Kalem, müessir ile eser arasında vâsıtadır ama مِفْعَلٌ vezninde olmadığı için ism-i âlet değildir.", "k": "Emsilenin_musannıfı.doc, 'İsmi âlet' bendi"}], "hata": "مَكْتَبٌ ism-i âlet sanılır; hâlbuki ism-i mekândır. Ölçü vezindir: مَفْعَل mekân, مِفْعَل âlet.", "kaynak": "Emsilenin_musannıfı.doc 'İsmi âlet' bendi · Kitap s.1–2"}, "6": {"b": [{"t": "نَصْرَةً binâ-i merre: bir kere yapmak. نِصْرَةً binâ-i nev': bir türlü yapmak. Fark yalnız ilk harekededir.", "k": "Kitap s.2 (EMSİLE_kitb.pdf)"}, {"t": "İsm-i tasgīr vezinleri: sülâsîde فُعَيْلٌ, rubâîde فُعَيْعِلٌ, humâsîde فُعَيْعِيلٌ. Misal: كَلَمٌ–كُلَيْمٌ, دَفْتَرٌ–دُفَيْتِرٌ.", "k": "Emsilenin_musannıfı.doc, 'İsmi tesğir' bendi"}, {"t": "Allah'ın, peygamberlerin isimlerinde ve umûr-ı muazzamada tasgīr cârî olmaz; küçüklük acziyet ifade eder.", "k": "Emsilenin_musannıfı.doc, 'İsmi tesğir' bendi"}, {"t": "Mükebberi ism-i fâil veya mef'ûl ise müennesi gelir; masdar ise gelmez.", "k": "Emsilenin_musannıfı.doc, 'İsmi tesğir' bendi"}, {"t": "İsm-i mensûb nispet yâsıyla yapılır (نَصْرِيٌّ): o işe mensûb olan.", "k": "Kitap s.2 (EMSİLE_kitb.pdf)"}], "hata": "Tasgīr \"az yardım eden\" diye çevrilir; doğrusu \"gücü yetmeyen, âciz\"dir. Ubeydullah misali bunu oturtur.", "kaynak": "Emsilenin_musannıfı.doc 'İsmi tesğir' bendi · Kitap s.2"}, "7": {"b": [{"t": "Mübâlağa ism-i fâil (نَصَّارٌ, فَعَّالٌ): çokça yapan. İsm-i tafdîl (أَنْصَرُ, أَفْعَلُ): daha çok yapan.", "k": "Kitap s.2 (EMSİLE_kitb.pdf)"}, {"t": "Fark: mübâlağada mübâlağalık kendi nefsindedir; tafdîlde başkasına nisbetledir. زَيْدٌ أَفْضَلُ مِنْ عَمْرٍو misali.", "k": "Emsilenin_musannıfı.doc, 'Mübâlağa ile tafdîl farkı' bendi"}, {"t": "Taaccüb-i evvel مَا أَنْصَرَهُ, sânî وَأَنْصِرْ بِهِ. İkisinin manası birdir, kalıpları ayrıdır.", "k": "Kitap s.2 (EMSİLE_kitb.pdf)"}, {"t": "Medine halkına niçin Ensâr denildiği bu kökten açılır; çocuğun hoşuna gider ve aklında kalır.", "k": "Genel sarf malûmâtı"}], "hata": "أَنْصَرُ ile أُنْصُرْ karıştırılır: biri isim (ism-i tafdîl), diğeri fiil (emr-i hâzır). Ayırt edici harekedir.", "kaynak": "Emsilenin_musannıfı.doc 'Mübâlağa ile tafdîl farkı' · Kitap s.2"}, "8": {"b": [{"t": "Muhtelife önce fiil ve isme ayrılır: 13 fiil, 11 isim.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Fiil ihbârî ve inşâî olur. İhbârî müsbet (2) ve menfî (5); inşâî talebî (4) ve gayr-i talebî (2, taaccüb).", "k": "Emsilenin_musannıfı.doc"}, {"t": "Talebî, husûlünü talep (emr-i gâib, emr-i hâzır) ve terkini talep (nehy-i gâib, nehy-i hâzır) olur.", "k": "Emsilenin_musannıfı.doc"}, {"t": "İsim müştak (6) ve câmid (7) olur; ayrıca sıfat (4) ve gayr-i sıfat (9).", "k": "Emsilenin_musannıfı.doc"}, {"t": "Müştak: fâil, mef'ûl, zamân, mekân, tafdîl, mübâlağa. Câmid: masdar, masdar-ı mîmî, âlet, merre, nev', tasgīr, mensûb.", "k": "Emsilenin_musannıfı.doc; Sarf_-_Emsile_Taksimatı.pdf"}], "hata": "Çocuk şemayı ezberler ama örneğe uygulayamaz. Çare: her dalın altına bir sîga yazdır, şemayı boş verip örnekten sordur.", "kaynak": "Emsilenin_musannıfı.doc taksîmât bölümü · Sarf_-_Emsile_Taksimatı.pdf"}, "9": {"b": [{"t": "Muttaride: sîgası madde ve hey'ette müttehid olandır (nasara, nasarâ, nasarû…). Muhtelife ise ikisinde de muhteliftir.", "k": "Köse Efendi şerhi, gör. 6", "o": {"osm": "معلوم ماضی، لغتده قائم اولان معنانك، اخبار ایدن زمانه مقدم اولان زمانه دلالت ایدر؛ ماضی ایکیدن خالی دکلدر: یا معلوم اولور یا مجهول اولور"}}, {"t": "Önce ma'lûm–mechûl, sonra gâib–muhâtab–mütekellim, sonra müzekker–müennes, sonra müfred–tesniye–cem'.", "k": "Genel sarf malûmâtı"}, {"t": "Gâib: mütekellim ve muhâtab olmayan. Aynı odada olsa da karşında değilse gâiptir.", "k": "Genel sarf malûmâtı"}, {"t": "Mütekellim müzekker–müennes diye ayrılmaz; konuşanın sesinden erkek mi kadın mı olduğu bellidir.", "k": "Genel sarf malûmâtı"}, {"t": "14 hâne: gâib 3 + gâibe 3 + muhâtab 3 + muhâtaba 3 + mütekellim 2.", "k": "Kitap s.2 (EMSİLE_kitb.pdf)"}], "hata": "Tesniyede muhâtab ve muhâtaba aynıdır (نَصَرْتُمَا). Çocuk bunu hata sanır; kasıtlı olduğunu söyle.", "kaynak": "Emsilenin_musannıfı.doc muttaride tarifi · Kitap s.2"}, "10": {"b": [{"t": "Mâzî mebnî asıllardandır, fetha üzerine mebnîdir.", "k": "Kitap s.2-3 (EMSİLE_kitb.pdf)"}, {"t": "Tasrîf: نَصَرَ، نَصَرَا، نَصَرُوا / نَصَرَتْ، نَصَرَتَا، نَصَرْنَ / نَصَرْتَ، نَصَرْتُمَا، نَصَرْتُمْ / نَصَرْتِ، نَصَرْتُمَا، نَصَرْتُنَّ / نَصَرْتُ، نَصَرْنَا", "k": "Kitap s.2-3 (EMSİLE_kitb.pdf)"}, {"t": "Gâib kısmında zamir sona gizli veya açık eklenir; muhâtab kısmında تُ grubu, mütekellimde تُ ve نَا.", "k": "Kitap s.2-3 (EMSİLE_kitb.pdf)"}, {"t": "Ritim şarttır: üç üç okutulur, tesniyeler uzatılır. Ezber ritimden doğar.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "نَصَرْنَ (cemî gâibe) ile نَصَرْنَا (mütekellim) karıştırılır. Fark elif-i medde: biri \"onlar avretler\", diğeri \"biz\".", "kaynak": "Kitap s.2–3"}, "11": {"b": [{"t": "Bu hafta yeni bilgi yok; ezberin otomatikleşmesi hedeflenir.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Kur'an'da mâzî bol: نَصَرَكُمُ اللَّهُ، أَنْزَلْنَاهُ، خَلَقَ، قَالُوا. Her birinde hangi hâne olduğu sorulur.", "k": "Kur'an-ı Kerîm", "o": {"ar": "إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ", "osm": "Kadr sûresi 1. âyet — أَنزَلْنَاهُ: mütekellim ma'a'l-gayr, mâzî ma'lûm"}}, {"t": "Zamir–sîga eşleştirmesi: âyetteki fâil kim, sîga onu tutuyor mu?", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "Çocuk sîgayı doğru okur ama \"kim yaptı\"yı söyleyemez. Oyun 5 (Kim Yardım Etti?) bu eksiği kapatır.", "kaynak": "Kitap s.3 · Sîga Avı Defteri"}, "12": {"b": [{"t": "Mechûlde fâil hazfedilir, mef'ûl nâib-i fâil olur.", "k": "Köse Efendi şerhi, gör. 6-7"}, {"t": "Mâzî mechûlün kalıbı: fâü'l-fiil dammeli, aynü'l-fiil kesreli — نُصِرَ.", "k": "Kitap s.3 (EMSİLE_kitb.pdf)"}, {"t": "Tasrîf ma'lûmun aynı sırayla yapılır: نُصِرَ، نُصِرَا، نُصِرُوا…", "k": "Kitap s.3 (EMSİLE_kitb.pdf)"}, {"t": "Masdarın mechûlü yoktur; ism-i fâil manasına gelirse ma'lûm, ism-i mef'ûl manasına gelirse mechûl masdar olur.", "k": "Emsilenin_musannıfı.doc"}], "hata": "Çocuk mechûlü \"olumsuz\" sanır. Çare: mechûl işin olmadığı değil, yapanın söylenmediği demektir.", "kaynak": "Kitap s.3 · Emsilenin_musannıfı.doc masdar bendi"}, "13": {"b": [{"t": "Ma'lûm–mechûl karşılaştırma tablosu doldurulur.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Kur'an'dan çift misal: خَلَقَ / خُلِقَ، كَتَبَ / كُتِبَ، قَتَلَ / قُتِلَ.", "k": "Kur'an-ı Kerîm"}, {"t": "Oyun 8 (Ma'lûm–Mechûl Düellosu) bu haftanın ana etkinliğidir.", "k": "OYUN_KILAVUZU_Emsile.docx"}], "hata": "Mechûlü olmayan sîgalar (masdar gibi) sorulduğunda çocuk zorla türetmeye çalışır. Tuzak soruyu kasten sor.", "kaynak": "Kitap s.2–3"}, "14": {"b": [{"t": "Muzâri' âmil-i manevî ile merfûdur; fâili tahtında müstetirdir.", "k": "Kitap s.3-4 (EMSİLE_kitb.pdf)"}, {"t": "Başına gelen dört harf: أ ن ي ت. Bunlar zamiri taşır.", "k": "Kitap s.3-4 (EMSİLE_kitb.pdf)"}, {"t": "Tasrîf: يَنْصُرُ، يَنْصُرَانِ، يَنْصُرُونَ / تَنْصُرُ، تَنْصُرَانِ، يَنْصُرْنَ / تَنْصُرُ… / أَنْصُرُ، نَنْصُرُ", "k": "Kitap s.3-4 (EMSİLE_kitb.pdf)"}, {"t": "Muzâri' hem şimdiki hâli hem geleceği karşılar; hangisi olduğu karîne ile anlaşılır.", "k": "Genel sarf malûmâtı"}], "hata": "Gâibe müfred تَنْصُرُ ile muhâtab müzekker تَنْصُرُ aynıdır. Bu da kasıtlıdır; karîne ayırır.", "kaynak": "Kitap s.3–4 · 2-MUHTELİFEDEKİ_SIRALAMA.doc"}, "15": {"b": [{"t": "Muzâri' mechûl: baştaki harf dammeli, aynü'l-fiil fethalı — يُنْصَرُ.", "k": "Kitap s.4 (EMSİLE_kitb.pdf)"}, {"t": "Tasrîf ma'lûmla aynı sırada yürür.", "k": "Kitap s.4 (EMSİLE_kitb.pdf)"}, {"t": "Kur'an bağlantısı: fiilin mechûl gelmesi çoğu yerde fâilin malûm oluşundan veya ta'zîmden dolayıdır.", "k": "Genel sarf ve belâgat malûmâtı"}], "hata": "يَنْصُرُ ile يُنْصَرُ yalnız iki harekeyle ayrılır. Renkli hareke bu haftada hayat kurtarır.", "kaynak": "Kitap s.4"}, "16": {"b": [{"t": "Masdarın tasrîfi yoktur; müfred, tesniye, cem' olarak gelir.", "k": "Kitap s.5 (EMSİLE_kitb.pdf)"}, {"t": "İsm-i fâil sülâsîde 10 sîga ile tasrîf edilir; ziyâde bâblarda sırf 6 sîga ile gelir.", "k": "Kitap s.5 (EMSİLE_kitb.pdf)"}, {"t": "İsm-i mef'ûl de aynı şekilde; müzekker–müennes ve müfred–tesniye–cem' üzerinden yürür.", "k": "Kitap s.5 (EMSİLE_kitb.pdf)"}, {"t": "İsimlerde mütekellim ve muhâtab hânesi yoktur; isim şahsa değil zâta delâlet eder.", "k": "Genel sarf malûmâtı"}], "hata": "Çocuk isimleri de 14 hâne üzerinden çekmeye kalkar. Baştan söyle: isimler 14 değil, 6/10 hânedir.", "kaynak": "Kitap s.5 · Emsilenin_musannıfı.doc 'İsmi fail' bendi"}, "17": {"b": [{"t": "Ay 4'ün toplu tekrarı. Yeni bilgi yok.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Bir âyet seçilip içindeki bütün sîgalar çıkarılır: Fâtiha 5 ve Kadr 1–5 bu iş için idealdir.", "k": "Kur'an-ı Kerîm"}, {"t": "Sîga Avı Defteri toplu gözden geçirilir; boş bırakılan sütunlar doldurulur.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "Tekrar haftasını hafife alma. Aralıklı tekrarın 21. gün hânesi bu hafta dolar.", "kaynak": "Kitap s.2–5"}, "18": {"b": [{"t": "لَمْ cezm eder; muzâri'nin sonu sâkin olur (لَمْ يَنْصُرْ).", "k": "Kitap s.6 (EMSİLE_kitb.pdf)"}, {"t": "Cemî ve tesniye hânelerinde nûn düşer: لَمْ يَنْصُرُوا، لَمْ يَنْصُرَا.", "k": "Kitap s.6 (EMSİLE_kitb.pdf)"}, {"t": "Mechûlü de tasrîf edilir: لَمْ يُنْصَرْ…", "k": "Kitap s.6 (EMSİLE_kitb.pdf)"}, {"t": "Lafzen muzâri', manen mâzîdir; bu yüzden mâzîyi nefyeder.", "k": "Emsilenin_musannıfı.doc, 'Lem ve lemmâ' bendi"}], "hata": "Nûnun düşmesi gözden kaçar. Tahtada nûnu yazıp üstünü çizerek göster.", "kaynak": "Kitap s.6"}, "19": {"b": [{"t": "لَمَّا da cezm eder, لَمْ gibi tasrîf edilir.", "k": "Kitap s.7-8 (EMSİLE_kitb.pdf)"}, {"t": "Farkı: لَمَّا'da nefiy şimdiye kadar süregelir ve bir beklenti vardır — \"henüz olmadı ama olması bekleniyor\".", "k": "Emsilenin_musannıfı.doc, 'Lem ve lemmâ' bendi"}, {"t": "Hucurât 14'teki وَلَمَّا يَدْخُلِ bu manayı çok açık gösterir: henüz girmedi, girmesi umuluyor.", "k": "Kur'an-ı Kerîm", "o": {"ar": "قَالَتِ الْأَعْرَابُ آمَنَّا ۖ قُل لَّمْ تُؤْمِنُوا وَلَٰكِن قُولُوا أَسْلَمْنَا وَلَمَّا يَدْخُلِ الْإِيمَانُ فِي قُلُوبِكُمْ", "osm": "Hucurât sûresi 14. âyet"}}], "hata": "İki edat aynı sanılır. \"Henüz\" kelimesini Türkçe çeviriye mutlaka koydur; fark orada görünür.", "kaynak": "Kitap s.7–8 · Emsilenin_musannıfı.doc"}, "20": {"b": [{"t": "مَا nefy-i hâl: şimdiki zamanı nefyeder, muzâri'yi merfû bırakır.", "k": "Kitap s.9-10 (EMSİLE_kitb.pdf)"}, {"t": "Tasrîfi muzâri'nin aynısıdır, başına مَا eklenir.", "k": "Kitap s.9-10 (EMSİLE_kitb.pdf)"}, {"t": "لَمْ cezm eder, مَا etmez — bu, iki sîgayı ayırmanın en pratik ölçüsüdür.", "k": "Genel sarf malûmâtı"}], "hata": "Çocuk مَا يَنْصُرُ'yu da cezmli okur. Son harekeyi her seferinde vurgulayarak okut.", "kaynak": "Kitap s.9–10"}, "21": {"b": [{"t": "لَا nefy-i istikbâl: geleceği nefyeder, muzâri' merfû kalır.", "k": "Kitap s.10-11 (EMSİLE_kitb.pdf)"}, {"t": "مَا ile arasındaki tek fark zamandır; kalıp aynıdır.", "k": "Kitap s.10-11 (EMSİLE_kitb.pdf)"}, {"t": "Nefiydeki لَا ile nehiydeki لَا aynı harftir ama biri âmil değil, diğeri âmil-i semâîdir.", "k": "Emsilenin_musannıfı.doc, 'Nefî ile nehîy' bendi"}], "hata": "Nefiy لَا ile nehiy لَا karıştırılır. Ölçü: son hareke merfû ise nefiy, meczûm ise nehiydir.", "kaynak": "Kitap s.10–11"}, "22": {"b": [{"t": "Beş menfî sîga tek tabloda toplanır: zaman, edat, i'râb.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "لَمْ geçmiş/cezm · لَمَّا geçmiş+henüz/cezm · مَا şimdi/ref' · لَا gelecek/ref' · لَنْ gelecek+te'kîd/nasb.", "k": "Kitap s.6-11 (EMSİLE_kitb.pdf)"}, {"t": "Oyun 7 (Zaman Makinesi) bu haftanın belkemiğidir.", "k": "OYUN_KILAVUZU_Emsile.docx"}], "hata": "Tabloyu hoca doldurursa akılda kalmaz. Boş tabloyu çocuğa doldurt, sonra düzelt.", "kaynak": "Kitap s.6–11"}, "23": {"b": [{"t": "لَنْ nasb eder: sonu fethalı olur (لَنْ يَنْصُرَ). Diğer menfîlerden ayrıldığı nokta budur.", "k": "Kitap s.12-13 (EMSİLE_kitb.pdf)"}, {"t": "Manası \"elbette olmaz\"; لَا'dan farkı te'kîd, yani manayı kuvvetlendirmesidir.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Âl-i İmrân 92'deki لَنْ تَنَالُوا الْبِرَّ bu te'kîdi çok iyi gösterir.", "k": "Kur'an-ı Kerîm", "o": {"ar": "لَن تَنَالُوا الْبِرَّ حَتَّىٰ تُنفِقُوا مِمَّا تُحِبُّونَ", "osm": "Âl-i İmrân sûresi 92. âyet"}}], "hata": "Fethalı son hareke unutulur. Üç edatı yan yana yazdır: لَا يَنْصُرُ / لَمْ يَنْصُرْ / لَنْ يَنْصُرَ — ref', cezm, nasb.", "kaynak": "Kitap s.12–13"}, "24": {"b": [{"t": "Emr-i gâib: lâm-ı emir + meczûm muzâri'. Lâm aslen kesrelidir (لِيَنْصُرْ).", "k": "Kitap s.14 (EMSİLE_kitb.pdf)"}, {"t": "وَ veya فَ'den sonra lâm sâkin okunur: فَلْيَعْبُدُوا.", "k": "Kur'an-ı Kerîm", "o": {"ar": "فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ", "osm": "Kureyş sûresi 3. âyet"}}, {"t": "Hazırda olmayana, vasıta ile verilen emirdir.", "k": "Kitap s.14 (EMSİLE_kitb.pdf)"}, {"t": "Mechûlü de gelir: لِيُنْصَرْ.", "k": "Kitap s.14 (EMSİLE_kitb.pdf)"}], "hata": "Çocuk emr-i gâibi emr-i hâzır sanır. Ölçü: başında لِ varsa gâib, hemze varsa hâzırdır.", "kaynak": "Kitap s.14"}, "25": {"b": [{"t": "Nehy-i gâib: لَا + meczûm muzâri' (لَا يَنْصُرْ). Emr-i gâibin olumsuzudur.", "k": "Kitap s.15 (EMSİLE_kitb.pdf)"}, {"t": "Nefiy ile nehiy farkı ikidir: (1) nefiy haber verir, nehiy talep eder — biri ihbârî, öteki inşâî. (2) Nefiydeki لَا âmil değildir, nehiydeki âmil-i semâîdendir.", "k": "Emsilenin_musannıfı.doc, 'Nefî ile nehîy' bendi"}, {"t": "Aynı harfin iki ayrı iş görmesi çocuğa şaşırtıcı gelir; bu şaşkınlık iyi bir öğretim fırsatıdır.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "لَا يَنْصُرُ / لَا يَنْصُرْ ayrımı bu yılın en çok hata verilen yeridir. Her derste bir kez sordur.", "kaynak": "Kitap s.15 · Emsilenin_musannıfı.doc 'Nefî ile nehîy'"}, "26": {"b": [{"t": "Ay 6 toplu tekrarı. Yeni bilgi yok.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Karma âyet setinden \"bu emir mi, haber mi?\" sorusu çalışılır.", "k": "Kur'an-ı Kerîm"}, {"t": "İnşâî–ihbârî ayrımı Hafta 8'deki taksîmât şemasına bağlanır; şema tekrar açılır.", "k": "Emsilenin_musannıfı.doc"}], "hata": "Tekrar haftalarında çocuk gevşer. Oyun ağırlığını artır, yeni bilgi verme.", "kaynak": "Kitap s.12–15"}, "27": {"b": [{"t": "Emr-i hâzır muzâri'den yapılır: baştaki harf atılır, gereken yerde vasıl hemzesi getirilir.", "k": "Kitap s.16 (EMSİLE_kitb.pdf)"}, {"t": "Hemzenin harekesi aynü'l-fiile göredir: dammeli ise dammeli (أُنْصُرْ), kesreli/fethalı ise kesreli (اِضْرِبْ، اِفْتَحْ).", "k": "Kitap s.16 (EMSİLE_kitb.pdf)"}, {"t": "Muhâtaba ve cemî hânelerinde nûn düşer: اُنْصُرِي، اُنْصُرُوا.", "k": "Kitap s.16 (EMSİLE_kitb.pdf)"}, {"t": "Emr-i hâzırın mechûlü lâm-ı emirle gelir (لِتُنْصَرْ).", "k": "Kitap s.16 (EMSİLE_kitb.pdf)"}], "hata": "Hemzenin harekesi ezberden söylenir, kuralı bilinmez. Üç misali (نصر، ضرب، فتح) yan yana yazdır.", "kaynak": "Kitap s.16"}, "28": {"b": [{"t": "Nehy-i hâzır: لَا + muhâtab meczûm muzâri' (لَا تَنْصُرْ).", "k": "Kitap s.17 (EMSİLE_kitb.pdf)"}, {"t": "Muhâtaba müfredde nûn düşer ve yâ kalır: لَا تَنْصُرِي.", "k": "Kitap s.17 (EMSİLE_kitb.pdf)"}, {"t": "Emr-i hâzırın aksine burada baştaki تَ korunur; çocuğa bu kıyas yaptırılır.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Duhâ 9–10 (فَلَا تَقْهَرْ / فَلَا تَنْهَرْ) hem nehiy hem ahlâk dersidir.", "k": "Kur'an-ı Kerîm", "o": {"ar": "فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ ﴿٩﴾ وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ", "osm": "Duhâ sûresi 9-10. âyetler"}}], "hata": "لَا تَنْصُرْ ile لَا يَنْصُرْ karıştırılır: biri sana, öteki ona. Baştaki harf ayırt eder.", "kaynak": "Kitap s.17"}, "29": {"b": [{"t": "Bu sayfada beş sîga bir arada: zamân/mekân/mîmî, âlet, merre, nev', tasgīr.", "k": "Kitap s.18 (EMSİLE_kitb.pdf)"}, {"t": "مَنْصَرٌ'un üç vechi tekrar hatırlatılır; siyak-sebak vurgulanır.", "k": "Kitap s.1-2 (EMSİLE_kitb.pdf)"}, {"t": "İsm-i âletin lâzım fiilde gelmeyişi: her âletin bir eseri vardır, lâzım fiil mef'ûle geçmez.", "k": "Emsilenin_musannıfı.doc, 'İsmi âlet' bendi"}, {"t": "Merre ile nev' arasındaki fark yalnız ilk harekededir; tahtada yan yana yazılır.", "k": "Kitap s.18 (EMSİLE_kitb.pdf)"}], "hata": "Beş sîga bir derste sıkıştırılırsa hiçbiri oturmaz. İki güne böl: üç sîga + iki sîga.", "kaynak": "Kitap s.18 · Emsilenin_musannıfı.doc"}, "30": {"b": [{"t": "İsm-i mensûb: nispet yâsı ile, müşedded (نَصْرِيٌّ).", "k": "Kitap s.19 (EMSİLE_kitb.pdf)"}, {"t": "Mübâlağa ism-i fâil vezni فَعَّالٌ; Kur'an'da غَفَّار، تَوَّاب، قَهَّار.", "k": "Kur'an-ı Kerîm", "o": {"ar": "إِنَّهُ كَانَ غَفَّارًا", "osm": "Nûh sûresi 10. âyet"}}, {"t": "İsm-i tafdîl vezni أَفْعَلُ; müennesi فُعْلَى gelir (أَكْبَر / كُبْرَى).", "k": "Kitap s.19 (EMSİLE_kitb.pdf)"}, {"t": "Mübâlağa kendi nefsinde, tafdîl başkasına nisbetle çokluk bildirir.", "k": "Emsilenin_musannıfı.doc"}], "hata": "أَفْعَلُ vezni hem tafdîl hem bazı fiillerde emir görünür. Bağlamdan ayırmayı öğret.", "kaynak": "Kitap s.19"}, "31": {"b": [{"t": "Taaccüb-i evvel: مَا أَنْصَرَهُ. Taaccüb-i sânî: وَأَنْصِرْ بِهِ. Manaları birdir.", "k": "Kitap s.20-21 (EMSİLE_kitb.pdf)"}, {"t": "Sânînin tasrîfi zamirler üzerinden yürür: بِهِ، بِهَا، بِهِمَا، بِكَ، بِكُمْ، بِي، بِنَا…", "k": "Kitap s.20-21 (EMSİLE_kitb.pdf)"}, {"t": "Kur'an'da أَسْمِعْ بِهِمْ وَأَبْصِرْ (Meryem 38) taaccüb-i sânînin en açık misalidir.", "k": "Kur'an-ı Kerîm", "o": {"ar": "أَسْمِعْ بِهِمْ وَأَبْصِرْ يَوْمَ يَأْتُونَنَا", "osm": "Meryem sûresi 38. âyet"}}, {"t": "Kitap burada biter. Ferâğ kaydı 1317 tarihlidir; çocuğa gösterilir, hatim merâsimi yapılır.", "k": "Kitap s.21, ferâğ kaydı (EMSİLE_kitb.pdf)"}], "hata": "مَا أَنْصَرَهُ'daki مَا nefiy sanılır. Burada mâ-i taaccübiyyedir; nefiy değildir.", "kaynak": "Kitap s.20–21"}, "32": {"b": [{"t": "Aynı 24 kalıp, yeni kökle tekrarlanır: كَتَبَ، يَكْتُبُ، كِتَابَةً…", "k": "KELİME_ÇEKİM.xls"}, {"t": "Çocuk artık kalıbı biliyor; yalnız harfleri değiştiriyor. Bu, yılın en tatmin edici haftasıdır.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "KELİME_ÇEKİM.xls'teki hazır çekimler kontrol için kullanılır.", "k": "KELİME_ÇEKİM.xls"}, {"t": "Bakara 183'teki كُتِبَ عَلَيْكُمُ الصِّيَامُ mechûlü hatırlatır.", "k": "Kur'an-ı Kerîm", "o": {"ar": "كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ", "osm": "Bakara sûresi 183. âyet"}}], "hata": "Masdarlar semâîdir; her kökte نَصْرًا kalıbı gelmez (كِتَابَةً gibi). Bunu baştan söyle, ezberletme.", "kaynak": "KELİME_ÇEKİM.xls · Kitap s.1"}, "33": {"b": [{"t": "فَتَحَ يَفْتَحُ: aynü'l-fiil ve lâmü'l-fiil hançere harfi olduğu için muzâri'si fethalıdır.", "k": "KELİME_ÇEKİM.xls"}, {"t": "خَرَجَ يَخْرُجُ: نَصَرَ ile aynı bâbdandır, kıyas kolaydır.", "k": "KELİME_ÇEKİM.xls"}, {"t": "Buradan bâb kavramı sezdirilmeye başlanır — ama adı henüz konmaz, Binâ'ya bırakılır.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "Çocuk \"niçin yeftehu, yefruhu değil?\" diye sorar. Cevabı Binâ'ya havale et ama soruyu takdir et.", "kaynak": "KELİME_ÇEKİM.xls"}, "34": {"b": [{"t": "دَخَلَ يَدْخُلُ: nasara bâbı. عَلِمَ يَعْلَمُ: mâzîsi kesreli, muzâri'si fethalı — ayrı bâb.", "k": "KELİME_ÇEKİM.xls"}, {"t": "İki kökü yan yana koy: çocuk kendiliğinden \"bunlar farklı çalışıyor\" der. Köprü buradan kurulur.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "\"Bu farklara bâb denir, gelecek kitabımız Binâ bunları anlatır.\"", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "Bâb bahsini burada açma; merak uyandır, kapat. Erken açılan bâb bahsi Emsile ezberini bozar.", "kaynak": "KELİME_ÇEKİM.xls · Binâ mukaddimesi"}, "35": {"b": [{"t": "Yıl boyu tutulan Sîga Avı Defteri toplu okunur.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Fâtiha ve Amme cüzünün son on sûresi taranır; bulunan her sîga adıyla söylenir.", "k": "Kur'an-ı Kerîm"}, {"t": "Nasr sûresi panodan indirilir: bir yıl önce işaretlenmemiş olan kelimelerin hepsi artık işaretlidir. Bu, yılın kapanış sahnesidir.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "Bu haftayı sınav haftası gibi yapma. Kutlama havası, ezberi mühürler.", "kaynak": "Sîga Avı Defteri · Mushaf"}, "36": {"b": [{"t": "24 sîga ezberden, sırayla ve manasıyla sorulur.", "k": "Kitap s.1-2 (EMSİLE_kitb.pdf)"}, {"t": "Tasrîf turnuvası: Oyun 2 ve Oyun 9 birleştirilir.", "k": "OYUN_KILAVUZU_Emsile.docx"}, {"t": "Eksik kalan sîgalar not edilir, 37. haftada onlara ağırlık verilir.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "Ezber sınavını not için değil, eksik tespiti için yap. Çocuğa da böyle söyle.", "kaynak": "Kitap s.1–2"}, "37": {"b": [{"t": "Aralıklı tekrar kutusunun 60. gün bölmesi bu hafta tamamen boşaltılır.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Muttarideden zayıf kalan sîgalar tekrar tasrîf edilir.", "k": "Kitap s.2-21 (EMSİLE_kitb.pdf)"}, {"t": "Genel imtihana hazırlık: geçmiş sekiz imtihanın yanlışları gözden geçirilir.", "k": "IMTIHANLAR_Emsile.docx"}], "hata": "Her şeyi tekrar etmeye çalışma. Uygulamadaki tekrar listesi hangi konuların zayıf olduğunu zaten söylüyor; onlara odaklan.", "kaynak": "Kitap s.2–21"}, "38": {"b": [{"t": "Genel imtihan: 20 soru, 45 dakika.", "k": "IMTIHANLAR_Emsile.docx"}, {"t": "İmtihan sonrası aynı gün değerlendirme yapılmaz; ertesi güne bırakılır.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Sonuçlar uygulamaya girilir, çıkan tekrar listesi 39. haftanın içeriğini belirler.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "hata": "İmtihanı yıl sonu yargısı gibi sunma. \"Nereyi sağlamlaştıracağımızı görelim\" çerçevesi doğrudur.", "kaynak": "IMTIHANLAR_Emsile.docx"}, "39": {"b": [{"t": "Değerlendirme, icâzet merâsimi, Nasr sûresi üzerine kapanış sohbeti.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}, {"t": "Binâ'ya giriş: sülâsî mücerredin bâbları, mezîdün fîh kavramı — yalnız tanıtım.", "k": "Genel sarf malûmâtı"}, {"t": "\"Emsile sîgayı öğretti, Binâ bâbı öğretecek.\" Zincirin devamı gösterilir: Emsile → Binâ → Maksûd → Avâmil → İzhâr → Kâfiye.", "k": "TDV İslâm Ansiklopedisi, 'el-Emsile' maddesi"}], "hata": "Bitişi sessizce geçme. Merâsim, dokuz ayın hafızada kalmasını sağlayan son çividir.", "kaynak": "Kitap s.21 ferâğ kaydı · Binâ mukaddimesi"}}, "hocaNotlari": {"1": {"b": [{"t": "Sarfın tarifi: i'lâl ve idgâm cihetinden Arapça kelimelerin ahvali kendisiyle bilinen ilimdir; mevzûu yine bu cihetten kelimelerdir, gayesi telaffuz ve yazıda hatadan korunmaktır, hükmü farz-ı kifâyedir.", "k": "Emsilenin_musannıfı.doc; Köse Efendi şerhi, gör. 2", "o": {"osm": "بو دوست الله تعالی یه حمد و ثنادن ورسولنه صلاة وسلامدن صکره معلوم اوله که علم صرف فنی هر باره طالب علم صرفه شروع ایتمزدن اول اوچ شیئی بیلمك لازمدر: اولی تعریفنی، ثانیا موضوعنی، ثالثا صرفك وقوعندن مقصود ایدنن غرضنی بیلمك"}}, {"t": "Sarf ile nahiv arasındaki fark: sarf kelimenin kendi bünyesini (müfred hâlini), nahiv ise kelimenin cümle içindeki i'rab durumunu inceler. Bu yüzden \"sarf ilimlerin anası, nahiv babasıdır\" denilmiştir — anne çocuğun bünyesini, baba toplum içindeki yerini şekillendirir benzetmesiyle.", "k": "Emsilenin_musannıfı.doc"}, {"t": "İ'lâl: illet harflerinin (elif, vav, ya) kelime içinde başka bir harfe dönüşmesi veya düşmesidir; idgâm: aynı cins iki harfin birleşip şeddeli tek harf olmasıdır. Emsile bu iki konuya henüz girmez, yalnız sağlam (sahih) kökle çalışır; bu kasıtlı bir tedric usûlüdür.", "k": "Genel sarf malûmâtı — bu gözlem müfredatın kendi kurgusuna dair, tek bir dosyaya dayanmaz"}, {"t": "Mâzînin muzâriye takdim edilme sebepleri üçtür: (a) mâzî geçmişe, muzâri geleceğe delâlet eder, geçmiş gelecekten önce gelir; (b) mâzî kat'î bilgiye (tahkīk), muzâri ihtimale (teşkīk) delâlet eder, kesin olan ihtimalliden önce zikredilir; (c) mâzî mücerreddir (sade kök), muzâri ise zâid harf taşır (hemze, nûn, yâ, tâ), sade olan zâidden önce gelir.", "k": "Genel şerh geleneği — bk. Dâvûd-i Karsî ve Köse Efendi şerhlerinin mukaddime bölümleri"}, {"t": "Muzârinin masdar üzerine takdim edilme sebebi: masdar iştikakta asıl kabul edilse de bu ihtilaflı bir meseledir; muzârinin fiil oluşu ve fiilin amel etmesi ise ittifaklıdır. İttifaklı olan ihtilaflı olandan önce zikredilir.", "k": "Genel şerh geleneği"}, {"t": "\"Emsile\" kelimesinin kendisi mufâale bâbından bir masdardır (مَاثَلَ – يُمَاثِلُ – مُمَاثَلَةً ve مِثَالًا); cem'i de أَمْثِلَةٌ şeklinde gelir. Musannıf kendi kitabının adını dahi bir sarf dersi hâline getirmiştir.", "k": "Genel sarf malûmâtı — kelimenin kendi iştikak tahlili"}, {"t": "Niçin نَصَرَ ile başlandığına dair nakledilen üç te'vil: musannıfın Allah'tan yardım (nasr) niyaz etmesi, yardımı sevmesi, ve bu kitabın diğer ilim kitaplarına \"yardımcı\" olacağı düşüncesi.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Dâvûd-i Karsî şerhinin mukaddimesinde kendi kalemiyle anlattığına göre, bir dostu kendisinden Emsile-i Muhtelife'yi hem Türkçe hem Arapça ibarelerle şerh etmesini, dağınık kaideleri derli toplu bir araya getirmesini rica etmiştir; Karsî ayrıca döneminin bazı müderrislerinin bu kaideleri tam bilmediğinden yakınır.", "k": "Dâvûd-i Karsî şerhi, gör. 2", "o": {"ar": "قَدِ الْتَمَسَ مِنِّي بَعْضُ أَصْحَابِي أَنْ أَشْرَحَ الْأَمْثِلَةَ الْمُخْتَلِفَةَ بِتَعْبِيرَاتٍ تُرْكِيَّةٍ وَعَرَبِيَّةٍ، وَأَجْمَعَ الْقَوَاعِدَ الْمُنَاسِبَةَ الْمُتَفَرِّقَةَ"}}, {"t": "Karsî bütün eserlerinin mukaddimesinde olduğu gibi burada da kendini \"Dâvûd b. Muhammed el-Karsî el-Hanefî\" diye tanıtır; bu imza TDV İslâm Ansiklopedisi'ndeki biyografi maddesiyle birebir örtüşür (bk. Terimler sekmesi).", "k": "Dâvûd-i Karsî şerhi, gör. 2", "o": {"ar": "دَاوُدُ بْنُ مُحَمَّدٍ الْقَارِصِيُّ الْحَنَفِيُّ"}}, {"t": "Köse Efendi şerhi de aynı üçlü çerçeveyi (ta'rif, mevzû, gaye) ilk cümlelerinde verir: sarfın lügat manası \"bir hali başka bir hale döndürmek\", ıstılah manası ise \"bir asıl mananın muhtelif şekillere dönüşmesi\"dir; mevzûu kelâmın i'râbdan gayrı hâlleri, gayesi ise kıyasen bilip hata etmemektir.", "k": "Köse Efendi şerhi, gör. 2", "o": {"osm": "بو دوست الله تعالی یه حمد و ثنادن ورسولنه صلاة وسلامدن صکره معلوم اوله که علم صرف فنی هر باره طالب علم صرفه شروع ایتمزدن اول اوچ شیئی بیلمك لازمدر: اولی تعریفنی، ثانیا موضوعنی، ثالثا صرفك وقوعندن مقصود ایدنن غرضنی بیلمك"}}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 2-4; Köse Efendi şerhi, gör. 2; Emsilenin_musannıfı.doc."}, "2": {"b": [{"t": "İsm-i fâil işi yapanı (فَاعِلٌ vezni: نَاصِرٌ), ism-i mef'ûl işin kendisine yapıldığı şeyi (مَفْعُولٌ vezni: مَنْصُورٌ) gösterir.", "k": "Kitap s.1 (EMSİLE_kitb.pdf)"}, {"t": "Fâilin mef'ûle takdim sebepleri: fâil her fiile lâzımdır (fiilsiz fâil olmaz), mef'ûl ise yalnız müteaddî fiillerde bulunur; ayrıca fâil ma'lûmdan, mef'ûl mechûlden müştaktır, ma'lûm mechûlden önce gelir.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "Musannıfın ism-i fâilin başına فَ (fâ-i tefrî'iyye), ism-i mef'ûlün başına وَ getirmesinin sebebi: fâ, ism-i fâilin fiilin bir fer'i/neticesi olduğunu; vâv ise mef'ûlün ayrı bir cihetten geldiğini gösterir.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "هُوَ ve ذَاكَ zamirlerinin özellikle bu iki sîgaya eklenmesinin hikmeti: sülâsî mücerredde sîgalar zaten birbirinden ayrılır, fakat ziyade bâblarda yalnız aynü'l-fiilin harekesi fark eder (مُدَحْرِجٌ / مُدَحْرَجٌ gibi); bu karışıklığı önlemek için zamirler sabit işaret olarak konmuştur.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "Masdarın ism-i fâil üzerine takdim sebebi: masdar müştakun minh (kendisinden türetilen), ism-i fâil müştaktır (türeyen); türetilen kaynak türeyenden önce zikredilir.", "k": "2-MUHTELİFEDEKİ_SIRALAMA.doc"}, {"t": "İştikak: iki kelimenin aynı harflerde ve genel manada ortak olup yalnız sîga bakımından ayrılmasıdır. Emsile'nin tamamı aslında masdardan yapılan 24 farklı iştikaktır; bu bütünlüğü çocuğa değil size hatırlatmak, dersi bir sistem olarak görmenizi kolaylaştırır.", "k": "Genel sarf malûmâtı"}, {"t": "Köse Efendi şerhi muhtelife-muttaride ayrımını ve altı sîganın taksîmâtını (ism-i âlet, binâ-i nev', ism-i tasgīr, ism-i mensûb masdara dahildir; mübâlağa ile ism-i tafdîl ism-i fâile dahildir) bizim ders planımızdaki sırayla verir; kitabın bu noktaya kadarki kısmına \"mukaddime-i sarf\" adını verir.", "k": "Köse Efendi şerhi, gör. 4", "o": {"osm": "اسم آلت، بناء نوع، اسم تصغیر، اسم منسوب مصدرده داخلدردر؛ و مبالغه ایله اسم فاعل و اسم تفضیل اسم فاعله داخلدر"}}], "kaynak": "Köse Efendi şerhi, gör. 4; Dâvûd-i Karsî şerhi, gör. 5-12; 2-MUHTELİFEDEKİ_SIRALAMA.doc."}, "3": {"b": [{"t": "Muttaride tarifi: sîgası hem maddede (kök harflerde) hem hey'ette (kalıpta) tek/ittihat halinde olan sîgalardır; muhtelife ise her iki cihetten de farklıdır.", "k": "Köse Efendi şerhi, gör. 6", "o": {"osm": "معلوم ماضی، لغتده قائم اولان معنانك، اخبار ایدن زمانه مقدم اولان زمانه دلالت ایدر؛ ماضی ایکیدن خالی دکلدر: یا معلوم اولور یا مجهول اولور"}}, {"t": "14 hânenin sıralama mantığı: önce gâib zikredilir çünkü gâib en geniş kapsamlı zamir grubudur (konuşan ve dinleyen dışında kalan herkesi kapsar); sonra muhâtab (dinleyen, daha dar bir küme); en son mütekellim (yalnız konuşanın kendisi, en dar küme). Bu sıralama \"genişten dara\" kaidesine uyar.", "k": "Genel sarf malûmâtı"}, {"t": "Müzekkerin müennesten önce gelmesi: sarf ıstılahında müzekker asıl, müennes ise müzekkere bir alâmet (te'nis tâsı, elif vb.) eklenmesiyle oluşan fer' kabul edilir; asıl fer'den önce zikredilir.", "k": "Genel sarf malûmâtı"}, {"t": "Müfred–tesniye–cem' sıralaması aynı kaideye dayanır: müfred asıldır, tesniye ve cem' ona eklenen harflerle (elif-nûn, vâv-nûn, yâ-nûn gibi) oluşan fer'lerdir.", "k": "Genel sarf malûmâtı"}, {"t": "Mütekellimin müzekker–müennes diye ayrılmaması: konuşan zaten sesinden bellidir, ayrıca bir alâmet koymaya lüzum yoktur; bu, sarfın gereksiz tekrardan kaçınma (îcâz) prensibinin bir örneğidir.", "k": "Genel sarf malûmâtı"}, {"t": "Zamir gizliliği meselesi: gâib sîgalarında fâil zamiri sîganın içine gizlenir (müstetir), açık olarak görünmez; bu, çocuklara \"kim yaptı\" sorusunu sordurarak sezdirilir.", "k": "Kitap s.2-3 (EMSİLE_kitb.pdf)"}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 13-16; Köse Efendi şerhi, gör. 5-6; Emsilenin_musannıfı.doc."}, "4": {"b": [{"t": "Mechûlde fâil hazfedilir (cümleden çıkarılır) ve mef'ûl, fâilin yerini alarak \"nâib-i fâil\" (fâilin vekili) olur; bu yüzden nâib-i fâil merfû gelir, tıpkı fâil gibi.", "k": "Köse Efendi şerhi, gör. 6-7"}, {"t": "Mâzî mechûlün kalıp değişimi: fâü'l-fiil (ilk kök harf) damme, aynü'l-fiil (orta kök harf) kesre alır — نُصِرَ. Muzâri mechûlde ise başa gelen harf damme, aynü'l-fiil fetha alır — يُنْصَرُ.", "k": "Kitap s.3-4 (EMSİLE_kitb.pdf)"}, {"t": "Masdarın mechûlü yoktur çünkü masdar zaten fâilden bağımsız, işin kendisini (soyut adını) ifade eder; fâil–mef'ûl ayrımı fiilde olur, masdarda değil.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Kur'an'da ve fasih kelâmda mechûl sîganın tercih edilme sebepleri: fâilin zaten bilinip tekrara gerek olmaması, fâili gizleme, işin kendisine (mef'ûle) dikkat çekme isteği, veya fâilin ta'zîmi/tenzîhi.", "k": "Genel sarf ve belâgat malûmâtı"}, {"t": "Ma'lûm–mechûl ayrımının çocuğa en kolay sezdirilme yolu: \"kim yaptı belli mi, belli değil mi\" sorusu; belli ise ma'lûm, belli değilse mechûldür.", "k": "Pedagojik not — proje kaynaklarına değil öğretim tekniğine dair"}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 16-19; Köse Efendi şerhi, gör. 6-8."}, "5": {"b": [{"t": "Beş nefiy edatının i'rab etkisi tek tabloda: لَمْ ve لَمَّا muzâriyi cezmeder (sonu sâkin); مَا ve لَا muzâriyi ref' üzere bırakır (değiştirmez); لَنْ muzâriyi nasbeder (sonu fethalı).", "k": "Dâvûd-i Karsî şerhi, gör. 13-18"}, {"t": "لَمْ ile لَمَّا arasındaki fark yalnız zaman uzunluğu değil, beklenti farkıdır: لَمْ mutlak olarak \"olmadı\" der, hüküm kesindir; لَمَّا ise \"henüz olmadı, olması bekleniyor\" manası taşır, bir süreç ve beklenti ifade eder.", "k": "Emsilenin_musannıfı.doc, 'Lem ve lemmâ' bendi"}, {"t": "لَنْ'in diğer nefiy edatlarından farkı te'kîddir (kuvvetlendirme): sade nefiyden daha güçlü, kesin bir \"asla olmayacak\" manası verir; bu yüzden nahivciler لَنْ'i sade لَا'dan ayrı bir bâb saymışlardır.", "k": "Genel sarf malûmâtı"}, {"t": "Nefiy edatlarının hepsi muzâriye has olup mâzinin başına gelmez (لَمْ ve لَمَّا hariç, ki onlar da muzâriyi mâzî manasına çevirerek nefyeder); bu incelik çocuğa \"nefiy hep fiilin geleceğiyle konuşur\" diye özetlenebilir.", "k": "Kitap s.6-13 (EMSİLE_kitb.pdf)"}, {"t": "Kur'an'da menfî sîgaların sıklığı: en çok لَا (nefy-i istikbâl) ve لَمْ (cahd-ı mutlak) kullanılır; لَنْ daha nâdir ve daha vurgulu yerlerde (yeminler, kesin vaad/vaîdler) görülür.", "k": "Genel gözlem — proje dosyalarına dayanmaz"}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 13-18 (nefiy edatlarının i'râb tafsîlâtı); Köse Efendi şerhi, gör. 9-13."}, "6": {"b": [{"t": "Nefiy ile nehiy arasındaki iki temel fark: (a) nefiy ihbârîdir, bir hâli haber verir; nehiy inşâîdir, bir talebi (yapmama talebini) bildirir. (b) Nefiydeki لَا âmil değildir (i'rabı değiştirmez, مَا يَنْصُرُ gibi hep merfû kalır); nehiydeki لَا âmil-i semâîdendir, muzâriyi cezmeder.", "k": "Emsilenin_musannıfı.doc, 'Nefî ile nehîy' bendi"}, {"t": "Emr-i gâibin yapısı aslında \"lâm-ı emir + meczûm muzâri'\"dir (لِيَنْصُرْ); bu yüzden sarf ıstılahında emr-i gâib, \"fiil-i emr\" değil \"muzâri' meczûm bi-lâm\" olarak sınıflandırılır. Emr-i hâzır ise doğrudan kendi sarih kalıbına sahiptir (أُنْصُرْ).", "k": "Dâvûd-i Karsî şerhi, gör. 19-24"}, {"t": "Lâm-ı emrin harekesi aslen kesredir; ancak وَ veya فَ harfinden sonra gelirse sükûn üzere okunur (فَلْيَعْبُدُوا gibi) — bu, Arapçada ardışık hareke yükünü hafifletme (tahfîf) kaidesinin bir örneğidir.", "k": "Genel sarf/nahiv malûmâtı"}, {"t": "Emr-i gâib \"hazırda olmayana, bir vasıta ile verilen emir\" olarak tarif edilir — emreden ile emredilen arada bir üçüncü şahıs/vasıta bulunur (imamın cemaate \"filanca şunu yapsın\" demesi gibi).", "k": "Kitap s.14 (EMSİLE_kitb.pdf)"}, {"t": "Nehy-i gâib de aynı mantıkla emr-i gâibin olumsuzudur; tek fark لِ yerine لَا gelmesidir, ikisi de muzâriyi cezmeder.", "k": "Kitap s.15 (EMSİLE_kitb.pdf)"}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 19-24; Köse Efendi şerhi, gör. 13-17."}, "7": {"b": [{"t": "Câmid ile müştak arasındaki fark: müştak bir kökten türeyip o kökün manasını taşıyan isimdir (fâil, mef'ûl gibi); câmid ise başka bir kelimeden türememiş, kendi başına duran isimdir. Masdar dahi bir bakıma câmid sayılır — çünkü kendisi başkasının kaynağıdır, kendisi başkasından türememiştir.", "k": "Emsilenin_musannıfı.doc"}, {"t": "Masdar-ı mîmî ile mücerred (sade) masdar arasındaki fark yalnız başa gelen mîm harfidir; mîm harfi manaya fazladan bir şey katmaz, sadece kalıbı değiştirir — bu yüzden ikisi de \"yardım etmek\" diye çevrilir.", "k": "Emsilenin_musannıfı.doc"}, {"t": "İsm-i âletin sülâsî mücerrede has kalıp taşıması (مِفْعَلٌ) ve ziyade bâblardan gelmemesi: âlet ismi kısa ve pratik kullanım için sade kalıpta durur; fiilin bütün ziyade harflerini âlet ismine taşımak dilde ağırlık yaratırdı.", "k": "Emsilenin_musannıfı.doc, 'İsmi âlet' bendi"}, {"t": "İsm-i âletin lâzım (geçişsiz) fiilden gelmemesi: âlet, bir işi bir nesne üzerinde gerçekleştirmeye yarayan vasıtadır; geçişsiz fiilde iş bir nesneye geçmediği için âlete de ihtiyaç kalmaz.", "k": "Emsilenin_musannıfı.doc, 'İsmi âlet' bendi"}, {"t": "مَنْصَرٌ kalıbının üç ayrı manayı (zaman, mekân, masdar-ı mîmî) tek sîgada taşıması, ileride Binâ dersinde göreceğiniz \"sülâsî dışı bâblarda ism-i mekân/zaman kalıbının مُفْعَل şeklinde ayrışması\" konusuna bir hazırlıktır; şimdilik çocuğa yalnız \"aynı kalıp üç kapıyı birden açıyor\" diye anlatılır.", "k": "Kitap s.1-2; Emsilenin_musannıfı.doc"}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 24-30; Köse Efendi şerhi, gör. 17-22."}, "8": {"b": [{"t": "İsm-i tasgīrin üç asli vezni: sülâsîde فُعَيْلٌ (كَلَمٌ – كُلَيْمٌ), rubâîde فُعَيْعِلٌ (دِرْهَمٌ – دُرَيْهِمٌ), humâsîde فُعَيْعِيلٌ. Vezin, kökteki harf sayısına göre otomatik belirlenir.", "k": "Emsilenin_musannıfı.doc, 'İsmi tesğir' bendi"}, {"t": "Tasgīrin asıl manası küçüklük değil, çoğunlukla \"acziyet, güçsüzlük\" veya \"azlık\"tır; bazı bağlamlarda ise sevgi ve şefkat ifade eder (bir büyüğün küçüğe \"ey oğulcuğum\" — يَا بُنَيَّ demesi gibi). Bu ikinci kullanım çocuğa da hoş gelir.", "k": "Emsilenin_musannıfı.doc, 'İsmi tesğir' bendi"}, {"t": "Allah'ın ve peygamberlerin isimlerinde, ayrıca \"umûr-ı muazzama\" (büyük/mukaddes sayılan kavramlarda) tasgīr kullanılmaz; çünkü tasgīr bir tür küçültme, acziyet nispeti taşır, bu ise tazim gereken varlıklara yakışmaz.", "k": "Emsilenin_musannıfı.doc, 'İsmi tesğir' bendi"}, {"t": "Mübâlağa ism-i fâil ile ism-i tafdîl arasındaki fark: mübâlağa (نَصَّارٌ) bir işin kendi nefsinde çokça/yoğun yapıldığını bildirir, başka bir şeyle kıyas yoktur; ism-i tafdîl (أَنْصَرُ) ise mutlaka bir kıyas ve üstünlük bildirir (زَيْدٌ أَنْصَرُ مِنْ عَمْرٍو — Zeyd Amr'dan daha çok yardım edicidir).", "k": "Emsilenin_musannıfı.doc, 'Mübâlağa ile tafdîl farkı' bendi"}, {"t": "İsm-i mensûbun düzensiz (semâî) gelen bazı örnekleri vardır — kimi kelimelerde te'nis tâsı düşer, kimi kelimelerde kıyasa aykırı bir nisbet yâsı eklenir; Emsile bu istisnalara girmez, yalnız kıyasî (kurala uyan) örnekle yetinir.", "k": "Genel sarf malûmâtı"}], "kaynak": "Dâvûd-i Karsî şerhi, gör. 30-38 (tasgīr ve tafdîl bahisleri); Köse Efendi şerhi, gör. 22-30."}, "9": {"b": [{"t": "Ferâğ kaydı, bir eserin istinsahının (yazımının) tamamlandığı tarihi bildiren nottur; elimizdeki nüshanın sonunda 1317 (hicrî) tarihi kayıtlıdır — kitabın yüzyılı aşkın süredir aynı metinle okutulduğunun bir belgesidir.", "k": "Kitap s.21 (EMSİLE_kitb.pdf, ferâğ kaydı)"}, {"t": "Emsile'den sonra okunacak Binâ (Binâ-i Merâh) kitabının konusu: sülâsî mücerred fiillerin altı bâbı (نَصَرَ يَنْصُرُ، ضَرَبَ يَضْرِبُ، فَتَحَ يَفْتَحُ، سَمِعَ يَسْمَعُ، حَسِبَ يَحْسِبُ، كَرُمَ يَكْرُمُ). Emsile \"sîga\"yı (kalıbı), Binâ \"bâb\"ı (kök harflerin hareke düzenini) öğretir.", "k": "Genel sarf malûmâtı — Binâ-i Merâh hakkında"}, {"t": "8. ayda tanıştırılan فَتَحَ، دَخَلَ، عَلِمَ gibi köklerin farklı muzâri' harekesi alması aslında bâb farkının ilk belirtisidir; Emsile bu farkı isimlendirmeden sezdirir, Binâ ise isimlendirip kurala bağlar.", "k": "KELİME_ÇEKİM.xls"}, {"t": "Sarf silsilesinin tamamı: Emsile (sîga) → Binâ (bâb) → Maksûd (i'lâl ve idgâm) → İzzî → Merâh → nahve geçiş: Avâmil → İzhâr → Kâfiye. Bu zincirin bilinmesi, dokuz aylık emeğin nereye bağlandığını görmek için sizin için de bir ufuk açar.", "k": "TDV İslâm Ansiklopedisi, 'el-Emsile' maddesi (bk. Terimler sekmesi)"}, {"t": "İcâzet merasiminin klasik usûldeki karşılığı: hoca, öğrencinin kitabı baştan sona anladığına ve nakledebileceğine şehadet eder; bu yalnız bir \"bitirme kutlaması\" değil, ilim silsilesine bir halka eklenmesidir.", "k": "Genel icâzet geleneği — proje dosyalarına dayanmaz"}], "kaynak": "Kitap s.20-21 ferâğ kaydı; Dâvûd-i Karsî ve Köse Efendi şerhlerinin taaccüb bahisleri (Karsî gör. 36-38, Köse Efendi gör. 35-41); Binâ-i Merâh mukaddimesi."}}, "terimler": [{"id": "sarf", "baslik": "Sarf", "arapca": "الصرف", "p": ["Sözlükte \"çevirmek, döndürmek\" anlamına gelir. Terim olarak ikiye ayrılır: amelî sarf, bir kelimeyi (masdar veya mâzî) farklı fiil ve isim kalıplarına dönüştürme işlemidir (tasrif); nazarî sarf ise kelimelerin i'râb ve binâ dışındaki hallerinin kurallarını inceleyen ilmin adıdır.", "Sarf ilminde kök fiillerden türeyen fiiller ve isimler, bunlara ârız olan harf ve hareke değişiklikleri (i'lâl, idgâm, ibdâl, hazif vb.) incelenir. Müteahhir dilciler sarf ile tasrifi eş anlamlı sayarken kadim dilciler tasrifi, sarfın bir cüzü olarak görmüştür."], "kaynakHTML": "Hulûsi Kılıç, &quot;Sarf,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 2009), <a href=\"https://islamansiklopedisi.org.tr/sarf--arap-dili\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/sarf--arap-dili</a>."}, {"id": "mizan", "baslik": "Mîzân-ı Sarfî", "arapca": "فَعَلَ", "p": ["Bir kelimenin hangi harflerinin kök, hangilerinin ek olduğunu göstermek için kullanılan ölçüye mîzân-ı sarfî (sarf tartısı) denir; bu ölçü فَعَلَ kalıbıdır. Kökün ilk harfi fâ (fâü'l-fiil), ikinci harfi ayın (aynü'l-fiil), üçüncü harfi lâm'a (lâmü'l-fiil) karşılık gelir.", "Kelime dört kök harfliyse tartının sonuna bir lâm daha (فَعْلَلَ), beş harfliyse iki lâm daha eklenir. Kelimede ek harf varsa bunlar da tartıda karşılık geldiği yere yerleştirilir (تَفَعْلَلَ gibi)."], "kaynakHTML": "Hulûsi Kılıç, &quot;Sarf,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 2009), <a href=\"https://islamansiklopedisi.org.tr/sarf--arap-dili\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/sarf--arap-dili</a>."}, {"id": "emsile", "baslik": "el-Emsile", "arapca": "الأمثلة", "p": ["Arapça kelimelerin çekim kılavuzu olarak hazırlanmış, yazarı bilinmeyen (anonim) bir sarf kitabıdır. Özellikle Osmanlı medreselerinde Arapça derslerinde ilk okutulan ve ezberletilen eserdir.", "\"Nasara\" fiilinin sülâsî mücerredinden türeyen fiil ve isim kalıplarını konu edindiği için kitap ikiye ayrılır: el-Emsiletü'l-muhtelife (24 kalıbın karışık dizilişi, adı-zamanı-manası ile) ve el-Emsiletü'l-muttaride (aynı kalıpların şahıslara göre tam çekimi)."], "kaynakHTML": "İsmail Durmuş, &quot;el-Emsile,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 1995), <a href=\"https://islamansiklopedisi.org.tr/el-emsile\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/el-emsile</a>."}, {"id": "kalipsayisi", "baslik": "Kalıp Sayısı Neden Tartışmalı?", "arapca": "", "p": ["Emsile'deki kalıp sayısında görüş birliği yoktur. Yaygın kabul 24'tür (13 fiil, 11 isim); ancak مَنْصَرٌ kalıbını üç ayrı mana (mimli masdar, ism-i zamân, ism-i mekân) olarak ayrı ayrı sayanlar toplamı 26'ya, bazı ilâve kalıplarla 30-31'e çıkarmıştır.", "Buna karşılık fer'î kalıpları çıkarıp yalnız aslî kalıpları sayanlar 17'ye, hatta 9'a kadar indirmiştir. \"Emsile\" kelimesinin \"misal\"in azlık çoğulu (cem-i kıllet, 3-10 arası) olması da bu tartışmada bir gerekçe olarak zikredilir."], "kaynakHTML": "İsmail Durmuş, &quot;el-Emsile,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 1995), <a href=\"https://islamansiklopedisi.org.tr/el-emsile\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/el-emsile</a>."}, {"id": "musannif", "baslik": "Emsile'nin Musannifi", "arapca": "", "p": ["Emsile'nin gerçek yazarı bilinmemektedir. Bazı şerhlerde (Ahmed Çelebi es-Saruhânî, Çörekçizâde Köse Efendi) musannifin Hz. Ali olduğu belirtilse de bu isnadın teberrüken (bereket niyetiyle) yapıldığı kabul edilir; kesin bir tarihî bilgi değildir.", "Dâvûd-i Karsî'nin şerhinin mukaddimesinde geçen \"bazı arkadaşlarım Emsile-i Muhtelife'yi Türkçe ve Arapça ibarelerle şerh etmemi rica etti\" ifadesindeki \"el-Emsiletü'l-muhtelife\" tabiri, kitabın en eski isimlendirmelerinden birini bize gösterir."], "kaynakHTML": "İsmail Durmuş, &quot;el-Emsile,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 1995), <a href=\"https://islamansiklopedisi.org.tr/el-emsile\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/el-emsile</a>. Ayrıca bk. Dâvûd-i Karsî, <i>Şerhu'l-Emsile</i>, gör. 2: قَدِ الْتَمَسَ مِنِّي بَعْضُ أَصْحَابِي أَنْ أَشْرَحَ الْأَمْثِلَةَ الْمُخْتَلِفَةَ بِتَعْبِيرَاتٍ تُرْكِيَّةٍ وَعَرَبِيَّةٍ."}, {"id": "sarfcumlesi", "baslik": "Sarf Cümlesi", "arapca": "", "p": ["Osmanlı medreselerinde Emsile'den sonra sırasıyla Binâ, Maksûd, İzzeddin ez-Zencânî'nin el-İzzî'si ve Ahmed b. Ali b. Mes'ûd'un Merâh'ı okutulurdu. Bu beş esere birlikte \"sarf cümlesi\" denir.", "Medrese geleneğinde bu sıralamayı ezberletmek için bir tekerleme kullanılırdı: \"Emsile evlek evlek / Binâ yağlı börek / Maksûd karış kuruş / İzzî'de kırıldı kiriş / Yiğitsen Merâh'a giriş.\""], "kaynakHTML": "İsmail Durmuş, &quot;el-Emsile,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 1995), <a href=\"https://islamansiklopedisi.org.tr/el-emsile\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/el-emsile</a>."}, {"id": "mazini", "baslik": "Mâzinî ve et-Tasrîf", "arapca": "", "p": ["Zamanımıza ulaşan ilk müstakil sarf kitabı Ebû Osman el-Mâzinî'nin (ö. 249/863) et-Tasrîf'idir. Bu eser sayesinde Mâzinî sarf ilminin kurucusu kabul edilir; ondan önce sarf meseleleri nahiv ilminin içinde dağınık biçimde ele alınıyordu."], "kaynakHTML": "Hulûsi Kılıç, &quot;Sarf,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 2009), <a href=\"https://islamansiklopedisi.org.tr/sarf--arap-dili\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/sarf--arap-dili</a>."}, {"id": "davudikarsi", "baslik": "Dâvûd-i Karsî", "arapca": "داود قارصي", "p": ["Aslen Karslı olup doğum tarihi ve ailesi hakkında bilgi yoktur. Döneminde \"Dâvûd-i Karsî\" veya \"Dâvûd Efendi\" olarak tanınmıştır. Bütün eserlerinin mukaddimesinde kendisini Dâvûd b. Muhammed el-Karsî el-Hanefî diye tanıtır.", "Temel medrese eğitimini Kars'ta dönemin tanınmış zâhid ve âlimi Çolak Abdullah Efendi'den aldı; sonra İstanbul'a giderek tahsilini ve mülâzemetini tamamladı. Tefsir, kıraat, hadis, kelâm, mantık, cedel, Arap dili ve edebiyatı, ilm-i mîkat ve tasavvuf alanlarında eserler kaleme almış çok yönlü bir Osmanlı âlim ve müderrisidir.", "Emsile üzerine yazdığı Şerhu'l-Emsile (İstanbul 1301), bizim projemizde Hoca Köşesi'nin iki temel kaynağından biridir."], "kaynakHTML": "Cemil Akpınar, &quot;Dâvûd-i Karsî,&quot; <i>TDV İslâm Ansiklopedisi</i>, c. 9 (İstanbul: TDV İslâm Araştırmaları Merkezi, 1994), 31."}, {"id": "sururihasiye", "baslik": "EMSİLE_kitb.pdf'in Kenar Şerhi: Sürûrî", "arapca": "", "p": ["Elimizdeki ana kaynağın (EMSİLE_kitb.pdf) sayfa kenarlarında sürekli akan bir şerh metni bulunur; başlık kutusunda açıkça \"Emsile şerh-i Sürûrî\" yazar. Bu, Muslihuddin Mustafa Sürûrî'nin (ö. 969/1562) Şerhu'l-Emsile'sidir.", "TDV İslâm Ansiklopedisi bu şerhi \"Emsile'nin en güzel ve en eski şerhlerinden\" diye tanıtır ve Mukayyed Sarf Cümlesi'nin kenarında basıldığını (İstanbul 1316) belirtir — elimizdeki nüshanın (ferâğ 1317) bir yıl sonraki baskısı veya aynı dizinin bir devamı olması kuvvetle muhtemeldir."], "kaynakHTML": "İsmail Durmuş, &quot;el-Emsile,&quot; <i>TDV İslâm Ansiklopedisi</i> (İstanbul: TDV İslâm Araştırmaları Merkezi, 1995), <a href=\"https://islamansiklopedisi.org.tr/el-emsile\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/el-emsile</a>; ayrıca bk. EMSİLE_kitb.pdf, s. 236 (matbu nüshanın kendisi)."}, {"id": "hzali", "baslik": "Hz. Ali (r.a.) — Emsile'nin Nisbet Edildiği Sahâbî", "arapca": "علي بن أبي طالب", "p": ["Hz. Ali (r.a.), Peygamberimizin hem amcasının oğlu hem damadıdır; küçük yaşta Peygamberimizin evinde büyümüş, ilk Müslüman olan birkaç kişiden biridir ve dört halifenin dördüncüsüdür. Hafta 1'de Emsile'nin ona nisbet edildiğini (rivayete göre, teberrüken) öğrenmiştik — şimdi asıl kendisini, önce ilmî yönüyle, tanıyalım.", "İLMİ VE HİKMETİ. Peygamberimiz henüz genç yaştaki Hz. Ali'yi Yemen'e kadı (hâkim) olarak gönderdiğinde, Ali \"Ey Allah'ın Resûlü, beni kadılığı bilmediğim hâlde mi gönderiyorsun?\" diye sormuş; Peygamberimiz elini onun göğsüne koyup şöyle dua etmiştir: \"Allah kalbini doğruya iletsin, dilini hak üzere sabit kılsın.\" Hz. Ali, bu duadan sonra iki taraf arasında hüküm vermekte hiç tereddüt etmediğini anlatır (Ebû Dâvûd, Kitâbü'l-Akdiye, hadis no. 3582). Bir başka rivayette Peygamberimizin onun için \"Ben hikmet eviyim, Ali de onun kapısıdır\" buyurduğu nakledilir; bu rivayetin sağlamlık derecesi hadis âlimleri arasında tartışılmıştır — kimi hasen, kimi zayıf bulmuştur — fakat ihtilaflı olması bile Hz. Ali'nin ilim yönünün ne kadar öne çıktığını gösterir (Tirmizî, Kitâbü'l-Menâkıb).", "CESARETİ VE FEDAKÂRLIĞI. Hayber Kalesi kuşatıldığında Peygamberimiz \"Yarın sancağı öyle birine vereceğim ki Allah'ı ve Resûlünü sever, Allah ve Resûlü de onu sever\" buyurmuş, ertesi gün sancağı Hz. Ali'ye vermiştir. Onu Hayber halkını İslâm'a davete gönderirken de şöyle demiştir: \"Senin vesilenle tek bir kişinin doğru yola girmesi, sana kızıl develer verilmesinden daha hayırlıdır\" (Buhârî ve Müslim, Kitâbü Feżâʾili'ṣ-ṣaḥâbe). Bu söz, Hz. Ali'nin gücünü kılıçtan değil, insanlara doğruyu öğretebilmekten aldığını gösterir.", "PEYGAMBERİMİZE YAKINLIĞI. Tebük seferine giderken Peygamberimiz Medine'de yerine Hz. Ali'yi bırakmış, Ali bundan üzülüp \"Beni kadınlarla çocuklarla mı bırakıyorsun?\" deyince Peygamberimiz ona şöyle demiştir: \"Benim yanımdaki yerin, Mûsâ yanındaki Hârûn'un yeri gibi olmasına razı değil misin? Yalnız benden sonra peygamber yoktur.\" (Tirmizî, Kitâbü'l-Menâkıb, hadis no. 3730-3731, hasen sahih; ayrıca bk. Buhârî, Meğâzî; Müslim, Feżâʾilü's-sahâbe.)", "AHMED CEVDET PAŞA'NIN ANLATTIKLARINDAN. Ahmed Cevdet Paşa, Kısas-ı Enbiyâ ve Tevârîh-i Hulefâ adlı büyük eserinde Hz. Ali'nin hayatını genişçe anlatır: Kâbe'nin içinde doğduğuna dair rivayeti, küçük yaşta Peygamberimizin terbiyesinde büyüyüp ilk iman edenlerden olduğunu, hicret gecesi Peygamberimizin yerine yatağına yatarak onu tehlikeden koruduğunu (Mebît gecesi), Hz. Fâtıma ile evlenişini ve halife olduğunda son derece sade ve mütevazı bir hayat sürüp adaletten hiç ödün vermediğini nakleder.", "ASIM KÖKSAL'IN İSLÂM TARİHİ'NDEN. Asım Köksal, çok ciltli İslâm Tarihi'nde Hz. Ali'nin şahsiyetini ayrıntılı biçimde ele alır: cömertliğini ve ihtiyaç sahiplerine çoğu zaman gizlice yardım etmesini, ilim meclislerinde sorulan sorulara sabırla ve uzun uzun cevap vermekten çekinmemesini, halife olduğu dönemde bile son derece sade giyinip mütevazı yaşamasını anlatır."], "kaynakHTML": "Ebû Dâvûd, Süleymân b. el-Eş'as. <i>es-Sünen</i>, \"Kitâbü'l-Akdiye,\" hadis no. 3582. — Tirmizî, Muhammed b. Îsâ. <i>es-Sünen (el-Câmiu'ṣ-ṣaḥîḥ)</i>, \"Kitâbü'l-Menâkıb,\" hadis no. 3730-3731 ve ilgili bab. — Buhârî, Muhammed b. İsmâîl. <i>Ṣaḥîḥu'l-Buḫârî</i>, \"Kitâbü Feżâʾili'ṣ-ṣaḥâbe\" ve \"Kitâbü'l-Meğâzî.\" — Müslim, Müslim b. el-Haccâc. <i>Ṣaḥîḥu Müslim</i>, \"Kitâbü Feżâʾili'ṣ-ṣaḥâbe.\" — Ahmed Cevdet Paşa. <i>Kısas-ı Enbiyâ ve Tevârîh-i Hulefâ</i>, \"Hulefâ-yi Râşidîn: Hazret-i Ali\" bölümü (çeşitli baskılar, İstanbul). — Asım Köksal. <i>İslâm Tarihi</i>, Hz. Ali ve Hulefâ-i Râşidîn ciltleri (çeşitli baskılar, İstanbul: Köksal Yayıncılık)."}, {"id": "sarf_tarif2", "baslik": "Sarfın Lügat ve Istılah Tarifi", "arapca": "تَعْرِيفُ الصَّرْفِ", "p": ["Dâvûd-i Karsî şerhinin mukaddimesinde, bir ilme girmeden önce üç şeyin bilinmesi gerektiği söylenir: birincisi o ilmin tarifi (tanımı bilinsin, mechul kalmasın), ikincisi mevzûu (başka ilimlerden ayırt edilsin), üçüncüsü garazı/gayesi (çabası boşa gitmesin).", "Bu çerçeve içinde sarfın ıstılah tarifi şöyle verilir: sarf, kendileriyle Arapça kelime bünyelerinin i'râb olmayan hâllerinin bilindiği usûllerden (kaidelerden) ibaret bir ilimdir.", "Lügat manası ise Köse Efendi şerhinde verilir: sarf sözlükte \"bir şeyi bir hâlden başka bir hâle döndürmek\" demektir."], "kaynakHTML": "Dâvûd-i Karsî, <i>Şerhu'l-Emsile</i>, gör. 3 (proje dosyası: ŞuruhulemsileDavudiKarsi.pdf) — tarif ve üç şart cümlesi: أَنْ يُعْرَفَ ثَلَاثَةُ أَشْيَاءَ: الْأَوَّلُ تَعْرِيفُ الْعِلْمِ لِيَكُونَ مَعْلُومًا، (الثَّانِي) مَوْضُوعُهُ لِيَتَمَيَّزَ عَنْ غَيْرِهِ، (الثَّالِثُ) غَرَضُهُ لِئَلَّا يَكُونَ سَعْيُهُ عَبَثًا; ıstılah tarifi: فَالصَّرْفُ عِلْمٌ بِأُصُولٍ يُعْرَفُ بِهَا أَحْوَالُ أَبْنِيَةِ الْكَلِمِ الْعَرَبِيَّةِ الَّتِي لَيْسَتْ بِإِعْرَابٍ. Lügat manası için bk. Köse Efendi şerhi, gör. 2."}, {"id": "sarf_mevzu", "baslik": "Sarfın Mevzûu", "arapca": "مَوْضُوعُ الصَّرْفِ", "p": ["Sarfın mevzûu (konusu), Arapça kelime bünyeleridir — yani kelimelerin madde (kök harfleri) ve cüzleridir (parçalarıdır). Sarf, kelimeyi cümle içindeki yerine göre değil, kendi bünyesi açısından inceler."], "kaynakHTML": "Dâvûd-i Karsî, <i>Şerhu'l-Emsile</i>, gör. 3: مَوْضُوعُهُ أَبْنِيَةُ الْكَلِمِ الْعَرَبِيَّةِ أَيْ مَوَادُّهَا وَأَجْزَاؤُهَا."}, {"id": "sarf_gaye", "baslik": "Sarfın Gayesi (Garazı)", "arapca": "غَرَضُ الصَّرْفِ", "p": ["Sarfın gayesi (garazı), kelime bünyelerinin hâllerini bilmektir; tâ ki bir kelimeyi söylerken (edâ) ve ona mana verirken hatadan sakınılabilsin. Yani sarf öğrenmenin nihai faydası, Arapça konuşurken veya Kur'an-Sünnet okurken yanlış çekim yapmamaktır."], "kaynakHTML": "Dâvûd-i Karsî, <i>Şerhu'l-Emsile</i>, gör. 3: وَغَرَضُهُ مَعْرِفَةُ أَحْوَالِ الْأَبْنِيَةِ حَتَّى يُحْتَرَزَ عَنِ الْخَطَإِ فِي أَدَائِهَا وَمَعَانِيهَا."}, {"id": "sarf_vazi", "baslik": "Sarf İlminin Vâzıı (Kurucusu)", "arapca": "وَاضِعُ عِلْمِ الصَّرْفِ", "p": ["Sarf ilminin \"vâzıı\" (bir ilim olarak ilk ortaya koyan) konusunda iki rivayet nakledilir: tarihçilerin çoğunluğu, sarf yapılarına olan derin ilgisi sebebiyle Kûfeli nahiv âlimi Mu'az b. Müslim el-Herrâ'yı (ö. 187/803) bu ilmin vâzıı sayar. Bir kısım âlimler ise Hz. Ali'yi (r.a.) bu ilmin kurucusu kabul eder.", "Bu ikinci rivayet, Emsile'nin musannifliğinin de Hz. Ali'ye nisbet edilmesiyle aynı geleneğin bir parçasıdır (bk. \"Emsile'nin Musannifi\" maddesi).", "Vâzı meselesi, ilk müstakil sarf KİTABINI yazan (\"evvelü men devvene\") meselesinden ayrıdır — o da Ebû Osman el-Mâzinî'dir (bk. \"Mâzinî ve et-Tasrîf\" maddesi)."], "kaynakHTML": "وَاضِعُ عِلْمِ الصَّرْفِ (asıl ibare): عُدَّ مُعَاذُ بْنُ مُسْلِمٍ الْهَرَّاءُ وَاضِعَ عِلْمِ الصَّرْفِ، وَعَدَّ آخَرُونَ عَلِيَّ بْنَ أَبِي طَالِبٍ مُؤَسِّسَ هَذَا الْعِلْمِ — bk. genel Arap filolojisi tarihi kaynakları."}, {"id": "ilal_tarif", "baslik": "İ'lâl Tarifi", "arapca": "تَعْرِيفُ الْإِعْلَالِ", "p": ["İ'lâl, telaffuzu hafifletmek amacıyla illet harfinin (elif, vâv, yâ) kalb (başka bir harfe çevrilmesi), sükûn (harekesinin düşürülmesi) veya hazif (tamamen atılması) yoluyla değiştirilmesidir.", "Emsile bu konuya girmez; i'lâl, sülâsî mücerredin bâblarını ve illetli fiilleri işleyen Binâ ve özellikle Maksûd kitaplarında ayrıntılı işlenir (bk. \"Sarf Cümlesi\" maddesi)."], "kaynakHTML": "الْإِعْلَالُ تَغْيِيرُ حَرْفِ الْعِلَّةِ بِالْقَلْبِ أَوِ الْإِسْكَانِ أَوِ الْحَذْفِ تَخْفِيفًا — klasik sarf literatüründe standart tarif; bk. genel sarf kaynakları (Binâ ve Maksûd şerhleri)."}, {"id": "idgam_tarif", "baslik": "İdgâm Tarifi", "arapca": "تَعْرِيفُ الْإِدْغَامِ", "p": ["İdgâm, lügatte \"bir şeyi bir şeyin içine sokmak\" demektir.", "Istılahta ise sâkin bir harfi, kendisine benzer veya yakın harekeli bir harfle birleştirip, ikisini tek bir şeddeli harf hâline getirmektir (meselâ مَدَدَ kökünün مَدَّ olması gibi).", "Emsile bu konuya da girmez; idgâm, Binâ ve Maksûd kitaplarının konusudur."], "kaynakHTML": "es-Seyyid eş-Şerîf el-Cürcânî, <i>et-Ta'rîfât</i>, \"el-İdgâm\" maddesi: لغةً \"إِدْخَالُ الشَّيْءِ فِي الشَّيْءِ\"؛ اصطلاحاً \"أَنْ تُوصَلَ حَرْفًا سَاكِنًا بِحَرْفٍ مُتَحَرِّكٍ مِثْلِهِ أَوْ مُقَارِبِهِ بِحَيْثُ يَصِيرَانِ حَرْفًا وَاحِدًا مُشَدَّدًا\"."}, {"id": "muhtelife_tarif", "baslik": "Emsile-i Muhtelife Tarifi", "arapca": "تَعْرِيفُ الْأَمْثِلَةِ الْمُخْتَلِفَةِ", "p": ["Köse Efendi şerhinde, mukaddime-i sarf bittikten sonra şöyle denir: \"tâlib-i ilm bilsin ki Emsile iki kısım üzeredir: biri muhtelife, biri muttaridedir.\"", "Emsile-i Muhtelife, sîgaları hem maddede (kök harflerde) hem hey'ette (kalıpta) birbirinden farklı olan 24 örnektir; her biri ayrı bir kalıbı, adını ve manasını tek tek tanıtır (نَصَرَ، يَنْصُرُ، نَصْرًا، فَهُوَ نَاصِرٌ… gibi)."], "kaynakHTML": "Köse Efendi, <i>Emsile Şerhi</i>, gör. 4 (proje dosyası: EMSİLE_ŞERHİ_KÖSE_EFENDİ.pdf): طَالِبِ عِلْمِ بِيلْكِه أَمْثِلَه ايکی قسم اوزرینه در، بری مختلفه وبری مطرده در."}, {"id": "muttaride_tarif", "baslik": "Emsile-i Muttaride Tarifi", "arapca": "تَعْرِيفُ الْأَمْثِلَةِ الْمُطَّرِدَةِ", "p": ["Emsile-i Muttaride, sîgası hem maddede hem hey'ette müttehid (tutarlı, değişmeyen) olan sîgalardır; aynı kalıbın on dört şahıs/sayı/cinsiyet hânesine göre tam çekimidir (نَصَرَ، نَصَرَا، نَصَرُوا، نَصَرَتْ… gibi).", "Muhtelife ile fark şudur: muhtelifede her sîga hem madde hem hey'et bakımından bir öncekinden ayrılır; muttaridede ise yalnız şahıs/sayı/cinsiyet değişir, kök (madde) ve kalıp (hey'et) türü sabit kalır."], "kaynakHTML": "Köse Efendi, <i>Emsile Şerhi</i>, gör. 6 (proje dosyası: EMSİLE_ŞERHİ_KÖSE_EFENDİ.pdf)."}], "kaynakca": ["Durmuş, İsmail. &quot;el-Emsile.&quot; <i>TDV İslâm Ansiklopedisi</i>. İstanbul: TDV İslâm Araştırmaları Merkezi, 1995. <a href=\"https://islamansiklopedisi.org.tr/el-emsile\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/el-emsile</a>.", "Kılıç, Hulûsi. &quot;Sarf.&quot; <i>TDV İslâm Ansiklopedisi</i>. İstanbul: TDV İslâm Araştırmaları Merkezi, 2009. <a href=\"https://islamansiklopedisi.org.tr/sarf--arap-dili\" target=\"_blank\" rel=\"noopener\">islamansiklopedisi.org.tr/sarf--arap-dili</a>."], "hocaAsil": {"1": {"ar": "الْحَمْدُ لِلَّهِ الَّذِي جَعَلَ الْعَرَبِيَّةَ مِفْتَاحَ الْكَلَامِ وَصَيَّرَهُ آلَةَ تَحْقِيقِ الْمَقَامِ", "osm": "بو دوست الله تعالی یه حمد و ثنادن ورسولنه صلاة وسلامدن صکره معلوم اوله که علم صرف فنی هر باره طالب علم صرفه شروع ایتمزدن اول اوچ شیئی بیلمك لازمدر: اولی تعریفنی، ثانیا موضوعنی، ثالثا صرفك وقوعندن مقصود ایدنن غرضنی بیلمك", "kaynak": "Dâvûd-i Karsî şerhi, gör. 2 (Arapça mukaddime) — Köse Efendi şerhi, gör. 2 (Osmanlı Türkçesi tercümesi)"}, "2": {"ar": "فَهُوَ نَاصِرٌ — وَذَاكَ مَنْصُورٌ", "osm": "اسم آلت، بناء نوع، اسم تصغیر، اسم منسوب مصدرده داخلدردر؛ و مبالغه ایله اسم فاعل و اسم تفضیل اسم فاعله داخلدر", "kaynak": "Köse Efendi şerhi, gör. 4 (taksîmât cümlesi, kelimesi kelimesine)"}, "3": {"ar": "نَصَرَ — نَصَرَتْ — نَصَرْتَ — نَصَرْتُ", "osm": "معلوم ماضی، لغتده قائم اولان معنانك، اخبار ایدن زمانه مقدم اولان زمانه دلالت ایدر؛ ماضی ایکیدن خالی دکلدر: یا معلوم اولور یا مجهول اولور", "kaynak": "Köse Efendi şerhi, gör. 6 (mâzînin tarifi ve ma'lûm-mechûl taksîmi)"}, "4": {"ar": "نُصِرَ — نُصِرَتْ — نُصِرْتَ", "osm": "فعل ماضی مجهول: فاعلی محذوف، مفعولی نائب-i فاعل اولور", "kaynak": "Köse Efendi şerhi, gör. 6-7; Kitap s.3"}, "5": {"ar": "لَمْ يَنْصُرْ — لَمَّا يَنْصُرْ — مَا يَنْصُرُ — لَا يَنْصُرُ — لَنْ يَنْصُرَ", "osm": "بش نفی ادانی: لم و لما مضارعی جزمدر، ما و لا مرفوع بیراقر، لن نصب ایدر", "kaynak": "Dâvûd-i Karsî şerhi, gör. 13-18 (nefiy edatlarının i'râb tafsîlâtı)"}, "6": {"ar": "لِيَنْصُرْ — لَا يَنْصُرْ", "osm": "امر-i غائب لام-i امر ایله مجزوم مضارعدر؛ نهی-i غائب لا ایله مجزوم مضارعدر — نفی ایله نهی آراسنده فرق: نفی خبردر، نهی طلبدر", "kaynak": "Dâvûd-i Karsî şerhi, gör. 19-24; Emsilenin_musannıfı.doc 'Nefî ile nehîy'"}, "7": {"ar": "أُنْصُرْ — لَا تَنْصُرْ — مِنْصَرٌ", "osm": "امر-i حاضر مضارعدن یاپیلر: باشنداکی حرف عاطل اولنور، درکار اولان یرده همزه-i وصل گتورلر", "kaynak": "Dâvûd-i Karsî şerhi, gör. 24-30; Köse Efendi şerhi, gör. 17-22"}, "8": {"ar": "نُصَيْرٌ — نَصْرِيٌّ — نَصَّارٌ — أَنْصَرُ", "osm": "اسم تصغیرك وزنی: ثلاثیده فعیل، رباعیده فعیعل، خماسیده فعیعیل", "kaynak": "Dâvûd-i Karsî şerhi, gör. 30-38 (tasgīr ve tafdîl bahisleri); Köse Efendi şerhi, gör. 22-30"}, "9": {"ar": "مَا أَنْصَرَهُ — وَأَنْصِرْ بِهِ", "osm": "فعل تعجب-i اول و ثانی، معناسی بردر، صیغه سی ایکیدر", "kaynak": "Kitap s.20-21 ferâğ kaydı; Dâvûd-i Karsî gör. 36-38, Köse Efendi gör. 35-41"}}, "haftaAsil": {"1": {"ar": "نَصَرَ — يَنْصُرُ — نَصْرًا", "osm": "فعل ماضی بناء معلوم، مفرد مذکر غائب معناسی: یاردم ایتدی بر غائب ار / فعل مضارع بناء معلوم: یاردم ایدر بر غائب ار، گچمش زمانه یا حالا زمانه", "kaynak": "EMSİLE_kitb.pdf, s.1 (matn, birebir okunmuş)"}, "2": {"ar": "فَهُوَ نَاصِرٌ — وَذَاكَ مَنْصُورٌ", "osm": "اسم فاعل مفرد مذکر معناسی یاردم ایدیجی؛ اسم مفعول معناسی یاردم اولنمش", "kaynak": "Kitap s.1"}, "3": {"ar": "لَمْ يَنْصُرْ — لَمَّا يَنْصُرْ — مَا يَنْصُرُ — لَا يَنْصُرُ — لَنْ يَنْصُرَ", "osm": "beş menfî sîganın gâib müfred şekilleri", "kaynak": "Kitap s.1"}, "4": {"ar": "لِيَنْصُرْ — لَا يَنْصُرْ — أُنْصُرْ — لَا تَنْصُرْ", "osm": "emir ve nehyin gâib/hâzır şekilleri", "kaynak": "Kitap s.1"}, "5": {"ar": "مَنْصَرٌ — مِنْصَرٌ", "osm": "ism-i zamân/mekân/masdar-ı mîmî ve ism-i âlet", "kaynak": "Kitap s.1-2"}, "6": {"ar": "نَصْرَةً — نِصْرَةً — نُصَيْرٌ — نَصْرِيٌّ", "osm": "binâ-i merre, binâ-i nev', ism-i tasgīr, ism-i mensûb", "kaynak": "Kitap s.2"}, "7": {"ar": "نَصَّارٌ — أَنْصَرُ — مَا أَنْصَرَهُ — وَأَنْصِرْ بِهِ", "osm": "mübâlağa, tafdîl, taaccüb-i evvel ve sânî", "kaynak": "Kitap s.2"}, "8": null, "9": {"ar": "نَصَرَ — نَصَرَا — نَصَرُوا", "osm": "muttaridenin ilk hânesi: gâib müfred, tesniye, cem'", "kaynak": "Kitap s.2"}, "10": {"ar": "نَصَرَ نَصَرَا نَصَرُوا — نَصَرَتْ نَصَرَتَا نَصَرْنَ — نَصَرْتَ نَصَرْتُمَا نَصَرْتُمْ — نَصَرْتِ نَصَرْتُمَا نَصَرْتُنَّ — نَصَرْتُ نَصَرْنَا", "osm": "mâzî ma'lûmun tam 14 hânesi", "kaynak": "Kitap s.2-3"}, "11": {"ar": "نَصَرَكُمُ اللَّهُ — أَنْزَلْنَاهُ", "osm": "Kur'an'da mâzî örnekleri", "kaynak": "Kitap s.3 + Kur'an-ı Kerîm"}, "12": {"ar": "نُصِرَ نُصِرَا نُصِرُوا — نُصِرَتْ نُصِرَتَا نُصِرْنَ — نُصِرْتَ نُصِرْتُمَا نُصِرْتُمْ — نُصِرْتِ نُصِرْتُمَا نُصِرْتُنَّ — نُصِرْتُ نُصِرْنَا", "osm": "mâzî mechûlün tam 14 hânesi", "kaynak": "Kitap s.3"}, "13": {"ar": "نَصَرَ / نُصِرَ", "osm": "ma'lûm-mechûl karşılaştırması", "kaynak": "Kitap s.2-3"}, "14": {"ar": "يَنْصُرُ يَنْصُرَانِ يَنْصُرُونَ — تَنْصُرُ تَنْصُرَانِ يَنْصُرْنَ — تَنْصُرُ تَنْصُرَانِ تَنْصُرُونَ — تَنْصُرِينَ تَنْصُرَانِ تَنْصُرْنَ — أَنْصُرُ نَنْصُرُ", "osm": "muzâri' ma'lûmun tam 14 hânesi", "kaynak": "Kitap s.3-4"}, "15": {"ar": "يُنْصَرُ يُنْصَرَانِ يُنْصَرُونَ — تُنْصَرُ تُنْصَرَانِ يُنْصَرْنَ — تُنْصَرُ تُنْصَرَانِ تُنْصَرُونَ — تُنْصَرِينَ تُنْصَرَانِ تُنْصَرْنَ — أُنْصَرُ نُنْصَرُ", "osm": "muzâri' mechûlün tam 14 hânesi", "kaynak": "Kitap s.4"}, "16": {"ar": "نَصْرًا — نَاصِرٌ — مَنْصُورٌ", "osm": "masdar, ism-i fâil, ism-i mef'ûl tasrîfleri", "kaynak": "Kitap s.5"}, "17": {"ar": "فَاتِحُونَ نَصْرَ اللَّهِ", "osm": "Kur'an atölyesi: bir âyette kaç sîga var?", "kaynak": "Kitap s.2-5 + Kur'an-ı Kerîm"}, "18": {"ar": "لَمْ يَنْصُرْ لَمْ يَنْصُرَا لَمْ يَنْصُرُوا — لَمْ تَنْصُرْ لَمْ تَنْصُرَا لَمْ يَنْصُرْنَ — لَمْ تَنْصُرْ لَمْ تَنْصُرَا لَمْ تَنْصُرُوا — لَمْ تَنْصُرِي لَمْ تَنْصُرَا لَمْ تَنْصُرْنَ — لَمْ أَنْصُرْ لَمْ نَنْصُرْ", "osm": "cahd-ı mutlakın tam 14 hânesi", "kaynak": "Kitap s.6"}, "19": {"ar": "لَمَّا يَنْصُرْ لَمَّا يَنْصُرَا لَمَّا يَنْصُرُوا", "osm": "cahd-ı müstağrakın gâib hânesi", "kaynak": "Kitap s.7-8"}, "20": {"ar": "مَا يَنْصُرُ مَا يَنْصُرَانِ مَا يَنْصُرُونَ", "osm": "nefy-i hâlin gâib hânesi", "kaynak": "Kitap s.9-10"}, "21": {"ar": "لَا يَنْصُرُ لَا يَنْصُرَانِ لَا يَنْصُرُونَ", "osm": "nefy-i istikbâlin gâib hânesi", "kaynak": "Kitap s.10-11"}, "22": {"ar": "لَمْ / لَمَّا / مَا / لَا / لَنْ", "osm": "beş menfî sîganın mukayeseli tekrarı", "kaynak": "Kitap s.6-11"}, "23": {"ar": "لَنْ يَنْصُرَ لَنْ يَنْصُرَا لَنْ يَنْصُرُوا", "osm": "te'kîd-i nefy-i istikbâlin gâib hânesi", "kaynak": "Kitap s.12-13"}, "24": {"ar": "لِيَنْصُرْ لِيَنْصُرَا لِيَنْصُرُوا", "osm": "emr-i gâibin tam hânesi", "kaynak": "Kitap s.14"}, "25": {"ar": "لَا يَنْصُرْ لَا يَنْصُرَا لَا يَنْصُرُوا", "osm": "nehy-i gâibin tam hânesi", "kaynak": "Kitap s.15"}, "26": {"ar": "لِيَنْصُرْ / لَا يَنْصُرْ", "osm": "emir–nehiy Kur'an atölyesi", "kaynak": "Kitap s.12-15 + Kur'an-ı Kerîm"}, "27": {"ar": "أُنْصُرْ أُنْصُرَا أُنْصُرُوا — أُنْصُرِي أُنْصُرَا أُنْصُرْنَ", "osm": "emr-i hâzırın tam hânesi", "kaynak": "Kitap s.16"}, "28": {"ar": "لَا تَنْصُرْ لَا تَنْصُرَا لَا تَنْصُرُوا — لَا تَنْصُرِي لَا تَنْصُرَا لَا تَنْصُرْنَ", "osm": "nehy-i hâzırın tam hânesi", "kaynak": "Kitap s.17"}, "29": {"ar": "مَنْصَرٌ — مِنْصَرٌ — نَصْرَةً — نِصْرَةً — نُصَيْرٌ", "osm": "câmid isimler toplu", "kaynak": "Kitap s.18"}, "30": {"ar": "نَصْرِيٌّ — نَصَّارٌ — أَنْصَرُ", "osm": "mensûb, mübâlağa, tafdîl", "kaynak": "Kitap s.19"}, "31": {"ar": "مَا أَنْصَرَهُ — وَأَنْصِرْ بِهِ", "osm": "taaccüb + ferâğ kaydı 1317", "kaynak": "Kitap s.20-21"}, "32": {"ar": "كَتَبَ — يَكْتُبُ — كِتَابَةً", "osm": "yeni kök: كتب tam muhtelife", "kaynak": "KELİME_ÇEKİM.xls"}, "33": {"ar": "فَتَحَ — يَفْتَحُ / خَرَجَ — يَخْرُجُ", "osm": "yeni kökler: فتح ve خرج", "kaynak": "KELİME_ÇEKİM.xls"}, "34": {"ar": "دَخَلَ — يَدْخُلُ / عَلِمَ — يَعْلَمُ", "osm": "yeni kökler: دخل ve علم (bâb farkı)", "kaynak": "KELİME_ÇEKİM.xls"}, "35": {"ar": "إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ", "osm": "Kur'an tarama haftası: Nasr sûresi", "kaynak": "Kur'an-ı Kerîm, Nasr sûresi"}, "36": null, "37": null, "38": null, "39": {"ar": "نَصَرَ — سُئِلَ — يَفْتَحُ — بَابٌ", "osm": "kapanış + Binâ'ya (بَابٌ) giriş", "kaynak": "Kitap s.21 ferâğ kaydı; Binâ mukaddimesi"}}};

function bildir(m){const el=document.getElementById("durum");el.textContent=m;el.classList.add("gor");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("gor"),1800);}
const DEPO={
  async oku(k){ if(window.storage){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}
    try{return localStorage.getItem(k);}catch(e){return null;} },
  async yaz(k,v){ if(window.storage){try{return await window.storage.set(k,v);}catch(e){return null;}}
    try{localStorage.setItem(k,v);return true;}catch(e){return null;} },
  async sil(k){ if(window.storage){try{return await window.storage.delete(k);}catch(e){return null;}}
    try{localStorage.removeItem(k);return true;}catch(e){return null;} }
};
async function yukle(){
  const v=await DEPO.oku(ANAHTAR);
  if(v){try{S=Object.assign(S,JSON.parse(v));}catch(e){}}
  ciz();
}
